  // ======================

  call(functionName, payload) {
    if (this.config.offlineMode) {
      return this.offlineCall_(functionName, payload);
    }

    const tStart = performance.now();
    return new Promise((resolve, reject) => {
      // Setup timeout safety
      const timer = setTimeout(() => {
        reject({
          success: false,
          code: 'TIMEOUT',
          message: 'Kết nối máy chủ quá thời gian quy định (' + (this.config.timeoutMs/1000) + 's)'
        });
      }, this.config.timeoutMs);

      google.script.run
        .withSuccessHandler(res => {
          clearTimeout(timer);
          const duration = (performance.now() - tStart).toFixed(2);
          console.log(`--- PERF: ApiClient.call(${functionName}) took ${duration}ms`);
          if (res && typeof res === 'object') {
            resolve(res);
          } else {
            resolve({
              success: false,
              code: 'UNKNOWN_ERROR',
              message: 'Phản hồi từ máy chủ không hợp lệ'
            });
          }
        })
        .withFailureHandler(err => {
          clearTimeout(timer);
          const duration = (performance.now() - tStart).toFixed(2);
          console.log(`--- PERF: ApiClient.call(${functionName}) FAILED after ${duration}ms`);
          reject({
            success: false,
            code: 'SYSTEM_ERROR',
            message: err.message || 'Lỗi hệ thống Apps Script'
          });
        })
        [functionName](payload);
    });
  },

  // Private Helper: Simulates server response in offline stub mode
  offlineCall_(functionName, payload) {
    return new Promise((resolve) => {
      setTimeout(() => {
        switch (functionName) {
          case 'apiProductLoad':
            resolve({
              success: true,
              code: 'OK',
              data: JSON.parse(JSON.stringify(this.mockServerStore))
            });
            break;

          case 'apiProductCreate':
            const newP = JSON.parse(JSON.stringify(payload.product));
            if (!newP.maSP) {
              newP.maSP = 'SP' + String(this.mockServerStore.length + 1).padStart(4, '0');
            }
            if (this.mockServerStore.some(i => i.maSP.toLowerCase() === newP.maSP.toLowerCase())) {
              resolve({
                success: false,
                code: 'DUPLICATE_PRODUCT',
                message: 'Mã hàng ' + newP.maSP + ' đã bị trùng lặp!'
              });
            } else {
              this.mockServerStore.push(newP);
              resolve({
                success: true,
                code: 'OK',
                data: newP
              });
            }
            break;

          case 'apiProductUpdate':
            const updP = JSON.parse(JSON.stringify(payload.product));
            const idx = this.mockServerStore.findIndex(i => i.maSP.toLowerCase() === updP.maSP.toLowerCase());
            if (idx === -1) {
              resolve({
                success: false,
                code: 'NOT_FOUND',
                message: 'Không tìm thấy mã sản phẩm ' + updP.maSP
              });
            } else {
              this.mockServerStore[idx] = updP;
              resolve({
                success: true,
                code: 'OK',
                data: updP
              });
            }
            break;

          case 'apiProductDelete':
            const idToDel = payload;
            const delIdx = this.mockServerStore.findIndex(i => i.maSP.toLowerCase() === idToDel.toLowerCase());
            if (delIdx === -1) {
              resolve({
                success: false,
                code: 'NOT_FOUND',
                message: 'Không tìm thấy sản phẩm'
              });
            } else {
              this.mockServerStore.splice(delIdx, 1);
              resolve({
                success: true,
                code: 'OK',
                data: { maSP: idToDel }
              });
            }
            break;

          case 'apiProductFind':
            const idToFind = payload;
            const item = this.mockServerStore.find(i => i.maSP.toLowerCase() === idToFind.toLowerCase());
            if (!item) {
              resolve({
                success: false,
                code: 'NOT_FOUND',
                message: 'Không tìm thấy sản phẩm'
              });
            } else {
              resolve({
                success: true,
                code: 'OK',
                data: {
                  product: item,
                  uoms: [{ tenDV: item.dvtGoc, heSo: 1, giaNhap: item.giaNhapMacDinh, giaBanLe: item.giaBanLe, giaBanBuon: item.giaBanBuon, barcode: '', macDinh: true, active: true }]
                }
              });
            }
            break;

          case 'apiProductSearch':
            const q = (payload || '').toLowerCase().trim();
            const res = this.mockServerStore.filter(i => 
              [i.tenSP, i.maSP, i.sdk].join(' ').toLowerCase().includes(q)
            );
            resolve({
              success: true,
              code: 'OK',
              data: res
            });
            break;

          case 'apiProductExists':
            const codeToChk = payload;
            const chk = this.mockServerStore.some(i => i.maSP.toLowerCase() === codeToChk.toLowerCase());
            resolve({
              success: true,
              code: 'OK',
              data: chk
            });
            break;

          case 'apiProductGenerateCode':
            const codeGen = 'SP' + String(this.mockServerStore.length + 1).padStart(4, '0');
            resolve({
              success: true,
              code: 'OK',
              data: codeGen
            });
            break;

          case 'apiPurchaseLoad':
            resolve({
              success: true,
              code: 'OK',
              data: JSON.parse(JSON.stringify(this.mockPurchaseStore || []))
            });
            break;

          case 'apiPurchaseFind':
            const pnId = payload;
            const t = (this.mockPurchaseStore || []).find(x => x.soPhieu.toLowerCase() === pnId.toLowerCase());
            resolve({
              success: !!t,
              code: t ? 'OK' : 'NOT_FOUND',
              data: t ? JSON.parse(JSON.stringify(t)) : null
            });
            break;

          case 'apiPurchaseCreate':
            const newT = JSON.parse(JSON.stringify(payload));
            newT.soPhieu = newT.soPhieu || ('PN' + String((this.mockPurchaseStore || []).length + 1).padStart(6, '0'));
            newT.nguoiTao = 'admin';
            newT.trangThai = 'Đã nhập';
            newT.soMatHang = newT.lines.length;
            newT.tongTien = newT.summary.tienPhaiTra;
            if (!this.mockPurchaseStore) this.mockPurchaseStore = [];
            this.mockPurchaseStore.unshift(newT);
            resolve({
              success: true,
              code: 'OK',
              data: newT
            });
            break;

          case 'apiPurchaseUpdate':
            const updT = JSON.parse(JSON.stringify(payload));
            const uIdx = (this.mockPurchaseStore || []).findIndex(x => x.soPhieu.toLowerCase() === updT.soPhieu.toLowerCase());
            if (uIdx !== -1) {
              const updated = Object.assign({}, this.mockPurchaseStore[uIdx], updT, {
                soMatHang: updT.lines.length,
                tongTien: updT.summary.tienPhaiTra
              });
              this.mockPurchaseStore[uIdx] = updated;
              resolve({
                success: true,
                code: 'OK',
                data: updated
              });
            } else {
              resolve({
                success: false,
                code: 'NOT_FOUND',
                message: 'Không tìm thấy phiếu nhập cần sửa!'
              });
            }

          case 'apiPurchaseDelete':
            const delPn = payload;
            this.mockPurchaseStore = (this.mockPurchaseStore || []).filter(x => x.soPhieu.toLowerCase() !== delPn.toLowerCase());
            resolve({

          case 'apiNccLoad':
            resolve({
              success: true,
              code: 'OK',
              data: JSON.parse(JSON.stringify(this.mockNccStore || []))
            });
            break;

          // PERF FIX (2026-08-17) — mock offline đơn giản: chỉ mod_nhacungcap.html
          // dùng endpoint này, thêm field currentDebt = congNo thô (mock không
          // cần dựng lại DebtEngine đầy đủ).

            break;

          case 'apiNccCreate': {
            const nccName = (payload && payload.name) ? String(payload.name).trim() : '';
            if (!nccName) {
              resolve({ success: false, code: 'VALIDATION', message: 'Tên nhà cung cấp không được để trống' });
              break;
            }
            // Sinh mã tự động NCC001, NCC002...
            let maxNccNum = 0;
            (this.mockNccStore || []).forEach(n => {
              const m = String(n.maNCC || '').match(/(\d+)$/);
              if (m) maxNccNum = Math.max(maxNccNum, parseInt(m[1]));
            });
            const newNccId = 'NCC' + String(maxNccNum + 1).padStart(3, '0');
            const newNcc = {
              maNCC:       newNccId,
              tenNCC:      nccName,
              sdt:         payload.sdt         || '',
              mst:         payload.mst         || '',
              diaChi:      payload.diaChi      || '',
              email:       payload.email       || '',
              nguoiLienHe: payload.nguoiLienHe || '',
              soDKKDD:     payload.soDKKDD     || '',
              ghiChu:      payload.ghiChu      || '',
              noiBo:       payload.noiBoStr    || '',
              macDinhNhap: payload.macDinhNhapStr || ''
            };
            if (!this.mockNccStore) this.mockNccStore = [];
            this.mockNccStore.push(newNcc);
            resolve({ success: true, code: 'OK', data: { id: newNccId, name: nccName } });
            break;
          }

          case 'apiNccUpdate': {
            if (!payload || !payload.id) {
              resolve({ success: false, code: 'VALIDATION', message: 'Thiếu mã NCC cần cập nhật' });
              break;
            }
            const nccIdx = (this.mockNccStore || []).findIndex(n => String(n.maNCC) === String(payload.id));
            if (nccIdx < 0) {
              resolve({ success: false, code: 'NOT_FOUND', message: 'Không tìm thấy NCC: ' + payload.id });
              break;
            }
            const updNcc = Object.assign({}, this.mockNccStore[nccIdx], {
              tenNCC:      payload.name         || this.mockNccStore[nccIdx].tenNCC,
              sdt:         payload.sdt          || '',
              mst:         payload.mst          || '',
              diaChi:      payload.diaChi       || '',
              email:       payload.email        || '',
              nguoiLienHe: payload.nguoiLienHe  || '',
              soDKKDD:     payload.soDKKDD      || '',
              ghiChu:      payload.ghiChu       || '',
              noiBo:       payload.noiBoStr     || '',
              macDinhNhap: payload.macDinhNhapStr || ''
            });
            this.mockNccStore[nccIdx] = updNcc;
            resolve({ success: true, code: 'OK', data: { id: payload.id, name: updNcc.tenNCC } });
            break;
          }

          case 'apiDoctorLoad':
            resolve({
              success: true,
              code: 'OK',
              data: JSON.parse(JSON.stringify(this.mockDoctorStore || []))
            });
            break;

          case 'apiDoctorCreate': {

            if (!tenBS) {
              resolve({ success: false, code: 'VALIDATION_ERROR', message: 'Tên bác sĩ không được để trống.' });

            let maxBsNum = 0;

              if (m) maxBsNum = Math.max(maxBsNum, parseInt(m[1]));

            const newMaBS = 'BS' + String(maxBsNum + 1).padStart(6, '0');
            const newDoctor = {
              maBS: newMaBS,

              sdt: payload.sdt || '',

          case 'apiCustomerLoad':
            resolve({
              success: true,
              code: 'OK',
              data: JSON.parse(JSON.stringify((this.mockCustomerStore || []).filter(c => c.active !== false)))
            });
            break;

          // PERF FIX (2026-08-17) — mock offline đơn giản: chỉ mod_khachhang.html
          // dùng endpoint này, thêm field currentDebt = congNo thô (mock không
          // cần dựng lại DebtEngine đầy đủ).
          case 'apiCustomerLoadWithDebt':
            resolve({
              success: true,
              code: 'OK',
              data: JSON.parse(JSON.stringify((this.mockCustomerStore || []).filter(c => c.active !== false).map(c => Object.assign({}, c, { currentDebt: Number(c.congNo) || 0 }))))
            });
            break;

          case 'apiCustomerCreate': {
            const newCus = JSON.parse(JSON.stringify(payload));
            newCus.maKH = 'KH' + String(1000000 + this.mockCustomerStore.length + 1).slice(1);
            newCus.diemTL = 0;
            newCus.congNo = 0;
            newCus.active = true;
            this.mockCustomerStore.push(newCus);
            resolve({
              success: true,
              code: 'OK',
              data: newCus
            });
            break;
          }

          case 'apiCustomerUpdate': {
            const updCus = JSON.parse(JSON.stringify(payload));
            const cusIdx = (this.mockCustomerStore || []).findIndex(c => String(c.maKH) === String(updCus.maKH));
            if (cusIdx === -1) {
              resolve({ success: false, code: 'NOT_FOUND', message: 'Không tìm thấy khách hàng!' });
              break;
            }
            this.mockCustomerStore[cusIdx] = Object.assign({}, this.mockCustomerStore[cusIdx], updCus);
            resolve({
              success: true,
              code: 'OK',
              data: JSON.parse(JSON.stringify(this.mockCustomerStore[cusIdx]))
            });
            break;
          }

          case 'apiCustomerFind': {
            const cusIdToFind = payload;
            const foundCus = (this.mockCustomerStore || []).find(c => String(c.maKH) === String(cusIdToFind));
            resolve({
              success: !!foundCus,
              code: foundCus ? 'OK' : 'NOT_FOUND',
              data: foundCus ? JSON.parse(JSON.stringify(foundCus)) : null
            });
            break;
          }

          case 'apiCustomerDelete': {
            const cusIdToDel = payload;
            const delIdx = (this.mockCustomerStore || []).findIndex(c => String(c.maKH) === String(cusIdToDel));
            if (delIdx === -1) {
              resolve({ success: false, code: 'NOT_FOUND', message: 'Không tìm thấy khách hàng!' });
              break;
            }
            this.mockCustomerStore[delIdx].active = false;
            resolve({ success: true, code: 'OK', data: true });
            break;
          }

          case 'apiCustomerSetOpeningDebt': {
            const debtIdx = (this.mockCustomerStore || []).findIndex(c => String(c.maKH) === String(payload.maKH));
            if (debtIdx === -1) {
              resolve({ success: false, code: 'NOT_FOUND', message: 'Không tìm thấy khách hàng!' });
              break;
            }
            this.mockCustomerStore[debtIdx].congNo = Number(payload.soTien) || 0;
            this.mockCustomerStore[debtIdx].ngayCongNoTonDau = payload.ngay || '';
            resolve({
              success: true,
              code: 'OK',
              data: JSON.parse(JSON.stringify(this.mockCustomerStore[debtIdx]))
            });
            break;
          }

          default:
            resolve({
              success: false,
              code: 'UNKNOWN_ERROR',
              message: 'Lệnh gọi API ' + functionName + ' không được hỗ trợ ở chế độ offline.'
            });
        }
      }, 300); // 300ms simulated latency
    });
  }
};
