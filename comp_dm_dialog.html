<style>
.dm-dialog-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(4, 8, 15, 0.6);
  backdrop-filter: blur(12px);
  z-index: var(--z-index-overlay, 999);
  align-items: center;
  justify-content: center;
}
.dm-dialog-overlay.open {
  display: flex;
}
.dm-dialog {
  display: flex;
  flex-direction: column;
  width: var(--dialog-width-scale, 92vw);
  max-width: var(--dialog-max-width, 1380px);
  height: var(--dialog-height-scale, 90vh);
  background-color: var(--color-bg-dialog, #0c1524);
  border: 1px solid var(--color-glass-border, rgba(255, 255, 255, 0.08));
  border-radius: var(--radius-xl, 12px);
  box-shadow: var(--shadow-dialog);
  overflow: hidden;
  position: relative;
}
.dm-dialog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: var(--dialog-header-height, 60px);
  padding: 0 var(--space-lg, 24px);
  border-bottom: 1px solid var(--color-border-main, #1e293b);
  background-color: rgba(255, 255, 255, 0.01);
}
.dm-dialog-title {
  font-family: var(--font-family-sans);
  font-size: var(--font-lg, 18px);
  font-weight: var(--font-weight-bold, 600);
  color: var(--color-text-main, #f8fafc);
}
.dm-dialog-close {
  background: none;
  border: none;
  color: var(--color-text-muted, #94a3b8);
  font-size: 20px;
  cursor: pointer;
  transition: var(--transition-fast, all 0.15s ease);
}
.dm-dialog-close:hover {
  color: var(--color-danger, #ef4444);
}
.dm-dialog-body {
  flex: 1;
  padding: var(--space-lg, 24px);
  overflow-y: auto;
  background-color: rgba(255, 255, 255, 0.002);
}
.dm-dialog-footer {
  height: var(--dialog-footer-height, 65px);
  display: flex;
}
.dm-dialog-loading {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(12, 21, 36, 0.7);
  z-index: var(--z-index-loading, 1100);
  align-items: center;
  justify-content: center;
}
.dm-dialog-loading.show {
  display: flex;
}
.dm-dialog-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255,255,255,0.1);
  border-left-color: var(--color-info, #3b82f6);
  border-radius: 50%;
  animation: dm-spin 1s linear infinite;
}
@keyframes dm-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
<script>
class DMDialog {
  constructor(container, config = {}) {
    this.container = typeof container === 'string' ? document.getElementById(container) : container;
    this.config = Object.assign({
      title: '',
      onClose: null
    }, config);
    this.dom = {};
    this.init();
  }

  init() {
    this.render();
    this.bindEvents();
  }

  render() {
    if (!this.container) return;
    this.container.innerHTML = `
      <div class="dm-dialog-overlay">
        <div class="dm-dialog">
          <div class="dm-dialog-loading">
            <div class="dm-dialog-spinner"></div>
          </div>
          <div class="dm-dialog-header">
            <span class="dm-dialog-title">${this.config.title}</span>
            <button class="dm-dialog-close">×</button>
          </div>
          <div class="dm-dialog-body"></div>
          <div class="dm-dialog-footer"></div>
        </div>
      </div>
    `;
    this.dom.overlay = this.container.querySelector('.dm-dialog-overlay');
    this.dom.dialog = this.container.querySelector('.dm-dialog');
    this.dom.header = this.container.querySelector('.dm-dialog-header');
    this.dom.title = this.container.querySelector('.dm-dialog-title');
    this.dom.closeBtn = this.container.querySelector('.dm-dialog-close');
    this.dom.body = this.container.querySelector('.dm-dialog-body');
    this.dom.footer = this.container.querySelector('.dm-dialog-footer');
    this.dom.loading = this.container.querySelector('.dm-dialog-loading');
  }

  bindEvents() {
    if (this.dom.closeBtn) {
      this.dom.closeBtn.onclick = () => this.close();
    }
  }

  open() {
    if (this.dom.overlay) this.dom.overlay.classList.add('open');
  }

  close() {
    if (this.dom.overlay) this.dom.overlay.classList.remove('open');
    if (typeof this.config.onClose === 'function') {
      this.config.onClose();
    }
  }

  setTitle(title) {
    if (this.dom.title) this.dom.title.textContent = title;
  }

  setBody(html) {
    if (this.dom.body) this.dom.body.innerHTML = html;
  }

  showLoading() {
    if (this.dom.loading) this.dom.loading.classList.add('show');
  }

  hideLoading() {
    if (this.dom.loading) this.dom.loading.classList.remove('show');
  }

  destroy() {
    if (this.dom.closeBtn) this.dom.closeBtn.onclick = null;
    this.container.innerHTML = '';
    this.dom = {};
  }
}
</script>
