<script>
// ════════════════════════════════════════════════════════════════
//  CONTROLLER LAYER: BaoCaoLaiLoModule (mod_baocaolailo.html)
//  Sprint 15.7 — Báo cáo Lãi/Lỗ
// ════════════════════════════════════════════════════════════════
const BaoCaoLaiLoModule = {
  dom: {},
  state: { nhomSet: [], viTriSet: [] },
  initialized: false,

  init() {
    if (this.initialized) return;
    this.cacheDOM();
    this.populateTimeSelectors_();
    this.bindEvents();
    this.applyTimeTypeVisibility_();
    this.initialized = true;
  },

  cacheDOM() {
    this.dom = {
      fTimeType: document.getElementById('bcll-f-timetype'),
      boxNgay: document.getElementById('bcll-time-ngay'),
      boxTuNgay: document.getElementById('bcll-time-tungay'),
      boxThang: document.getElementById('bcll-time-thang'),
      boxQuy: document.getElementById('bcll-time-quy'),
      boxNam: document.getElementById('bcll-time-nam'),
      fNgay: document.getElementById('bcll-f-ngay'),
      fTu: document.getElementById('bcll-f-tu'),
      fDen: document.getElementById('bcll-f-den'),
      fThang: document.getElementById('bcll-f-thang'),
      fThangNam: document.getElementById('bcll-f-thang-nam'),
      fQuy: document.getElementById('bcll-f-quy'),
      fQuyNam: document.getElementById('bcll-f-quy-nam'),
      fNam: document.getElementById('bcll-f-nam'),
      fKhach: document.getElementById('bcll-f-khach'),
      fProduct: document.getElementById('bcll-f-product'),
      fNv: document.getElementById('bcll-f-nv'),
      fNhom: document.getElementById('bcll-f-nhom'),
      fViTri: document.getElementById('bcll-f-vitri'),
      fKho: document.getElementById('bcll-f-kho'),
      btnSearch: document.getElementById('bcll-btn-search'),
      tblBody: document.getElementById('bcll-tbl-body')
    };
  },

  // Cùng logic bộ chọn Tháng/Quý/Năm với mod_thuchi.html (Sprint 14) —
  // REUSE nguyên UI convention đã có trong project, không phát minh lại.
  populateTimeSelectors_() {
    const today = new Date();
    const y = today.getFullYear(), m = today.getMonth() + 1, q = Math.floor(today.getMonth() / 3) + 1;

    let monthOpts = '';
    for (let i = 1; i <= 12; i++) monthOpts += `<option value="${i}"${i === m ? ' selected' : ''}>Tháng ${i}</option>`;
    this.dom.fThang.innerHTML = monthOpts;

    let yearOpts = '';
    for (let i = y - 5; i <= y + 1; i++) yearOpts += `<option value="${i}"${i === y ? ' selected' : ''}>${i}</option>`;
    this.dom.fThangNam.innerHTML = yearOpts;
    this.dom.fQuyNam.innerHTML = yearOpts;
    this.dom.fNam.innerHTML = yearOpts;
    this.dom.fQuy.value = String(q);
    this.dom.fNgay.value = today.toISOString().slice(0, 10);
  },

  bindEvents() {
    this.dom.fTimeType.onchange = () => this.applyTimeTypeVisibility_();
    this.dom.btnSearch.onclick = () => this.search_();
  },

  applyTimeTypeVisibility_() {
    const t = this.dom.fTimeType.value;
    this.dom.boxNgay.classList.toggle('show', t === 'ngay');
    this.dom.boxTuNgay.classList.toggle('show', t === 'tungay');
    this.dom.boxThang.classList.toggle('show', t === 'thang');
    this.dom.boxQuy.classList.toggle('show', t === 'quy');
    this.dom.boxNam.classList.toggle('show', t === 'nam');
  },

  getTimeRange_() {
    const pad = n => String(n).padStart(2, '0');
    const t = this.dom.fTimeType.value;
    if (t === 'ngay') {
      const v = this.dom.fNgay.value;
      return v ? { from: v, to: v } : { from: null, to: null };
    }
    if (t === 'tungay') {
      return { from: this.dom.fTu.value || null, to: this.dom.fDen.value || null };
    }
    if (t === 'thang') {
      const y = Number(this.dom.fThangNam.value), mo = Number(this.dom.fThang.value);
      if (!y || !mo) return { from: null, to: null };
      const lastDay = new Date(y, mo, 0).getDate();
      return { from: `${y}-${pad(mo)}-01`, to: `${y}-${pad(mo)}-${pad(lastDay)}` };
    }
    if (t === 'quy') {
      const y = Number(this.dom.fQuyNam.value), qq = Number(this.dom.fQuy.value);
      if (!y || !qq) return { from: null, to: null };
      const startM = (qq - 1) * 3 + 1, endM = startM + 2;
      const lastDay = new Date(y, endM, 0).getDate();
      return { from: `${y}-${pad(startM)}-01`, to: `${y}-${pad(endM)}-${pad(lastDay)}` };
    }
    if (t === 'nam') {
      const y = Number(this.dom.fNam.value);
      if (!y) return { from: null, to: null };
      return { from: `${y}-01-01`, to: `${y}-12-31` };
    }
    return { from: null, to: null };
  },

  // Nạp 1 lần khi mở trang: Nhân viên/Quầy (apiBaoCaoLaiLoMeta, đọc
  // PB_PHIEUBAN 1 lần) + Nhóm SP/Vị trí SP (REUSE apiProductLoad đã có sẵn,
  // derive distinct set client-side — cùng pattern mod_tonkho.html Sprint 10).
  loadData() {
    Promise.all([
      ApiClient.call('apiBaoCaoLaiLoMeta'),
      ApiClient.call('apiProductLoad')
    ]).then(([metaRes, prodRes]) => {
      const meta = (metaRes && metaRes.success) ? metaRes.data : { nhanVien: [], kho: [] };
      this.dom.fNv.innerHTML = '<option value="">Tất cả nhân viên</option>' +
        meta.nhanVien.map(v => `<option value="${this.escAttr_(v)}">${this.escHtml_(v)}</option>`).join('');
      this.dom.fKho.innerHTML = '<option value="">Tất cả</option>' +
        meta.kho.map(v => `<option value="${this.escAttr_(v)}">${this.escHtml_(v)}</option>`).join('');

      const products = (prodRes && prodRes.success) ? (prodRes.data || []) : [];
      const nhomSet = new Set(), viTriSet = new Set();
      products.forEach(p => {
        if (p.nhomSP) nhomSet.add(p.nhomSP);
        if (p.viTri) viTriSet.add(p.viTri);
      });
      this.dom.fNhom.innerHTML = '<option value="">Tất cả</option>' +
        Array.from(nhomSet).sort().map(v => `<option value="${this.escAttr_(v)}">${this.escHtml_(v)}</option>`).join('');
      this.dom.fViTri.innerHTML = '<option value="">Tất cả</option>' +
        Array.from(viTriSet).sort().map(v => `<option value="${this.escAttr_(v)}">${this.escHtml_(v)}</option>`).join('');

      this.search_();
    });
  },

  search_() {
    const range = this.getTimeRange_();
    const payload = {
      startIso: range.from, endIso: range.to,
      khachQuery: this.dom.fKhach.value.trim(),
      productQuery: this.dom.fProduct.value.trim(),
      nguoiTao: this.dom.fNv.value,
      nhomSP: this.dom.fNhom.value,
      viTri: this.dom.fViTri.value,
      khoXuat: this.dom.fKho.value
    };
    this.dom.tblBody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text2);font-style:italic"><span class="spin"></span> Đang tải...</td></tr>`;
    ApiClient.call('apiBaoCaoLaiLo', payload)
      .then(res => {
        if (!res || !res.success) {
          this.dom.tblBody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--red);font-weight:bold">Lỗi tải dữ liệu: ${(res && res.message) || 'Không xác định'}</td></tr>`;
          return;
        }
        this.render_(res.data.rows || [], res.data.tong || {});
      })
      .catch(err => {
        this.dom.tblBody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--red);font-weight:bold">Lỗi hệ thống: ${err.message}</td></tr>`;
      });
  },

  render_(rows, tong) {
    if (!rows.length) {
      this.dom.tblBody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">Không có dữ liệu</td></tr>`;
      return;
    }
    // Dòng TỔNG CỘNG đứng ĐẦU bảng — đúng vị trí evidence
    // BaoCao_LaiLo_TheLight.pdf (dòng tổng nằm trên các dòng sản phẩm).
    const sumRow = `
      <tr class="bcll-sum-tr">
        <td colspan="4" style="text-align:center">TỔNG CỘNG</td>
        <td style="text-align:right">${this.fmt_(tong.soLuongBan)}</td>
        <td style="text-align:right">${this.fmtGiaNhap_(tong.giaNhap)}</td>
        <td style="text-align:right">${this.fmt_(tong.tienVon)}</td>
        <td style="text-align:right">${this.fmt_(tong.doanhThu)}</td>
        <td style="text-align:right">${this.fmtSigned_(tong.laiLo)}</td>
        <td style="text-align:right">${this.fmtPct_(tong.tyLeLoiNhuan)}</td>
      </tr>`;
    const body = rows.map((r, idx) => `
      <tr>
        <td style="text-align:center;color:var(--text2)">${idx + 1}</td>
        <td style="font-weight:600;color:#90caf9">${r.maSP}</td>
        <td>${r.tenSP || '—'}</td>
        <td>${r.dvt || '—'}</td>
        <td style="text-align:right">${this.fmt_(r.soLuongBan)}</td>
        <td style="text-align:right">${this.fmtGiaNhap_(r.giaNhap)}</td>
        <td style="text-align:right">${this.fmt_(r.tienVon)}</td>
        <td style="text-align:right">${this.fmt_(r.doanhThu)}</td>
        <td style="text-align:right">${this.fmtSigned_(r.laiLo)}</td>
        <td style="text-align:right">${this.fmtPct_(r.tyLeLoiNhuan)}</td>
      </tr>`).join('');
    this.dom.tblBody.innerHTML = sumRow + body;
  },

  escHtml_(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; },
  escAttr_(s) { return String(s).replace(/"/g, '&quot;'); },

  fmt_(v) {
    const n = Math.round(Number(v) || 0);
    return n.toLocaleString('vi-VN');
  },

  // FIX (2026-08-25): backend giữ nguyên giá trị thực tới tận bước này —
  // formatter làm tròn về số nguyên, KHÔNG giữ phần thập phân, đúng
  // convention thật của TheLight (BaoCao_LaiLo_TheLight.pdf: mọi giá trị
  // cột Giá nhập đều số nguyên — 580/6.864/2.000/3.120...; LOCKED TEST
  // 01-06 của 15.7_PO_Review_and_Costing_Decision.md cũng luôn làm tròn
  // hiển thị — VD 340.000/90=3.777,78 → "3.778"). KHÔNG đổi backend
  // costing/PB_CHITIET/TK_KHO/Inventory — chỉ sửa đúng 1 điểm presentation
  // này.
  fmtGiaNhap_(v) {
    // TEST 07 evidence: dòng TỔNG CỘNG của TheLight để trống Giá nhập khi
    // gộp nhiều ĐVT khác nhau — backend trả `null` cho đúng case này.
    if (v === null || v === undefined) return '—';
    const n = Math.round(Number(v) || 0);
    return n.toLocaleString('vi-VN');
  },

  // Lãi/Lỗ có thể âm — hiển thị màu đỏ khi lỗ, xanh khi lãi (không đổi số,
  // chỉ đổi màu cho dễ đọc, giống quy ước Thu/Chi màu ở mod_thuchi.html).
  fmtSigned_(v) {
    const n = Math.round(Number(v) || 0);
    const color = n < 0 ? '#ef5350' : '#66bb6a';
    return `<span style="color:${color}">${n.toLocaleString('vi-VN')}</span>`;
  },

  // %LN/Vốn: `null` = Tiền vốn = 0, CHƯA có PO decision (Phase 1.8, evidence
  // chưa đọc được — TEST 07 đề xuất, chưa có kết quả). Hiển thị "—" đúng
  // nghĩa BLOCKED, KHÔNG suy đoán 0%/N/A/Infinity.
  fmtPct_(v) {
    if (v === null || v === undefined || !Number.isFinite(v)) {
      return '<span class="bcll-blocked" title="BLOCKED — Tiền vốn = 0, chưa có PO decision (Phase 1.8, xem 15.7_BaoCaoLaiLo_Bug.md mục 3c)">—</span>';
    }
    const n = Math.round(v);
    const color = n < 0 ? '#ef5350' : '#66bb6a';
    return `<span style="color:${color}">${n.toLocaleString('vi-VN')}%</span>`;
  }
};
</script>
