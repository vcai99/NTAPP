<script>
// ════════════════════════════════════════════════════════════════
//  CONTROLLER LAYER: DsPhieuModule (mod_dsphieu.html)
// ════════════════════════════════════════════════════════════════
const DsPhieuModule = {
  PAGE_SIZE: 20,
  
  state: {
    docType: 'purchase',  // 'purchase' | 'khachtra' (Sprint 12, xem đầu file)
    allData: [],
    filtered: [],
    currentPage: 1,
    expandedRow: null
  },

  dom: {},
  initialized: false,

  init() {
    if (this.initialized) return;
    this.cacheDOM();
    this.bindEvents();
    this.fillNamFilter();
    this.initialized = true;
  },

  cacheDOM() {
    this.dom = {
      fDocType: document.getElementById('dsp-f-doctype'),
      thDoi: document.getElementById('dsp-th-doi'),
      fNam: document.getElementById('dsp-f-nam'),
      fThang: document.getElementById('dsp-f-thang'),
      fSearch: document.getElementById('dsp-f-search'),
      fSp: document.getElementById('dsp-f-sp'),
      fLoai: document.getElementById('dsp-f-loai'),
      fUser: document.getElementById('dsp-f-user'),
      fChualt: document.getElementById('dsp-f-chualt'),
      
      btnReload: document.getElementById('dsp-btn-reload'),
      btnTopSearch: document.getElementById('dsp-top-btn-search'),
      btnTopAdd: document.getElementById('dsp-top-btn-add'),
      btnTopImport: document.getElementById('dsp-top-btn-import'),
      btnTopExport: document.getElementById('dsp-top-btn-export'),
      
      tblBody: document.getElementById('dsp-tbl-body'),
      
      sumTong: document.getElementById('dsp-sum-tong'),
      sumCk: document.getElementById('dsp-sum-ck'),
      sumVat: document.getElementById('dsp-sum-vat'),
      sumTongcong: document.getElementById('dsp-sum-tongcong'),
      
      pgInfo: document.getElementById('dsp-pg-info'),
      pgBtns: document.getElementById('dsp-pg-btns')
    };
  },

  bindEvents() {
    // Sprint 12: chuyển nguồn dữ liệu Phiếu nhập ↔ Khách trả lại.
    this.dom.fDocType.onchange = () => {
      this.state.docType = this.dom.fDocType.value;
      this.dom.thDoi.textContent = this.state.docType === 'khachtra' ? 'Khách hàng' : 'Nhà cung cấp';
      this.dom.btnTopAdd.textContent = this.state.docType === 'khachtra' ? '＋ Khách trả lại' : '＋ Phiếu nhập';
      this.loadData();
    };

    // Top action bar buttons
    this.dom.btnTopSearch.onclick = () => this.applyFilter();
    this.dom.btnTopAdd.onclick = () => this.openNewEditor();
    
    // Placeholder actions
    this.dom.btnTopImport.onclick = () => toast('Tính năng Import dữ liệu đang phát triển', 'warn');
    this.dom.btnTopExport.onclick = () => toast('Tính năng Export dữ liệu đang phát triển', 'warn');
    
    // Sidebar filter triggers
    this.dom.fNam.onchange = () => this.applyFilter();
    this.dom.fThang.onchange = () => this.applyFilter();
    this.dom.fSearch.oninput = () => this.applyFilter();
    this.dom.fSp.oninput = () => this.applyFilter();
    this.dom.fLoai.onchange = () => this.applyFilter();
    this.dom.fChualt.onchange = () => this.applyFilter();
    
    this.dom.btnReload.onclick = () => this.loadData();

    // Global shortcut F3 focus to Product search input
    document.addEventListener('keydown', e => {
      if (e.key === 'F3') {
        const page = document.getElementById('page-dsphieu');
        if (page && page.classList.contains('show')) {
          e.preventDefault();
          this.dom.fSp.focus();
        }
      }
    });
  },

  fillNamFilter() {
    const sel = this.dom.fNam;
    if (!sel) return;
    sel.innerHTML = '<option value="">Tất cả</option>';
    const y = new Date().getFullYear();
    for (let i = y; i >= y - 4; i--) {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = i;
      if (i === y) o.selected = true;
      sel.appendChild(o);
    }
  },

  loadData() {
    this.state.expandedRow = null;
    this.renderLoading(true);

    if (this.state.docType === 'khachtra') {
      // Sprint 12: đọc apiKhachTraList, map về ĐÚNG shape hàng cũ
      // (soPhieu/ngayNhap/tenNCC/tongTien/chietKhau/vat/tongCong/ghiChu/
      // nguoiNhap/trangThai) để tái sử dụng applyFilter()/renderTable()/
      // renderSummary()/pager KHÔNG cần viết lại — chỉ đổi field mapping.
      ApiClient.call('apiKhachTraList')
        .then(res => {
          if (!res || !res.success) {
            this.renderError((res && res.message) || 'Lỗi không xác định');
            return;
          }
          this.state.allData = (res.data || []).map(p => ({
            soPhieu: p.soPhieu,
            ngayNhap: p.ngayNhap,
            tenNCC: p.tenKhach,          // field dùng chung để reuse search/render
            soHoaDon: p.soHoaDon,
            tongTien: p.tongTien,
            chietKhau: p.chietKhau,
            vat: p.vat,
            tongCong: p.tienPhaiTra,
            hinhThucTT: p.httt,
            tienThanhToan: p.tienThanhToan,
            ghiChu: p.ghiChu,
            nguoiNhap: '',
            // RETURN-DEC-P006 PENDING — chưa có khái niệm hủy phiếu Khách
            // trả lại, luôn coi mọi phiếu đã lưu là "Hiệu lực".
            trangThai: 'active',
            sanPhamList: ''
          }));
          this.applyFilter();
        })
        .catch(err => this.renderError(err.message));
      return;
    }

    PurchaseService.load()
      .then(tickets => {
        this.state.allData = tickets || [];
        this.applyFilter();
      })
      .catch(err => {
        this.renderError(err.message);
      });
  },

  applyFilter() {
    const nam = this.dom.fNam.value;
    const thang = this.dom.fThang.value;
    const search = (this.dom.fSearch.value || '').toLowerCase().trim();
    const sp = (this.dom.fSp.value || '').toLowerCase().trim();
    const loai = this.dom.fLoai.value;
    
    this.state.filtered = this.state.allData.filter(p => {
      // 1. Filter by Year (checks if date string contains the year)
      if (nam && !String(p.ngayNhap).includes(nam)) return false;
      
      // 2. Filter by Month
      if (thang) {
        const d = this.parseDate(p.ngayNhap);
        if (!d || (d.getMonth() + 1) !== parseInt(thang)) return false;
      }
      
      // 3. Filter by Search (NCC, SoPhieu, SoHoaDon)
      if (search && !(
        (p.soPhieu || '').toLowerCase().includes(search) ||
        (p.tenNCC || '').toLowerCase().includes(search) ||
        (p.soHoaDon || '').toLowerCase().includes(search)
      )) return false;
      
      // 4. Filter by Product Name/Barcode in SP list
      if (sp && !(p.sanPhamList || '').toLowerCase().includes(sp)) return false;
      
      // 5. Filter by Status
      if (loai) {
        if (loai === 'cancelled' && p.trangThai !== 'cancelled') return false;
        if (loai === 'active' && p.trangThai === 'cancelled') return false;
      }
      
      return true;
    });

    this.state.currentPage = 1;
    this.renderTable();
    this.renderSummary();
  },

  parseDate(s) {
    if (!s) return null;
    const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
    return new Date(s);
  },

  renderLoading(isLoading) {
    if (isLoading) {
      this.clearDataRows();
      const tr = document.createElement('tr');
      tr.className = 'dsp-empty-tr';
      tr.innerHTML = `<td colspan="12" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">
        <span class="spin"></span> Đang tải danh sách phiếu nhập...
      </td>`;
      this.dom.tblBody.appendChild(tr);
    }
  },

  renderError(msg) {
    this.clearDataRows();
    const tr = document.createElement('tr');
    tr.className = 'dsp-empty-tr';
    tr.innerHTML = `<td colspan="12" style="text-align:center;padding:32px;color:var(--red);font-weight:bold">
      Lỗi tải dữ liệu: ${msg}
    </td>`;
    this.dom.tblBody.appendChild(tr);
    
    this.dom.sumTong.textContent = '—';
    this.dom.sumCk.textContent = '—';
    this.dom.sumVat.textContent = '—';
    this.dom.sumTongcong.textContent = '—';
  },

  clearDataRows() {
    // Remove all rows except the first row (the summary row)
    const rows = Array.from(this.dom.tblBody.querySelectorAll('tr'));
    rows.forEach((r, idx) => {
      if (idx > 0) r.remove();
    });
  },

  renderTable() {
    this.clearDataRows();
    
    if (!this.state.filtered.length) {
      const tr = document.createElement('tr');
      tr.className = 'dsp-empty-tr';
      tr.innerHTML = '<td colspan="12" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">Không tìm thấy phiếu nào</td>';
      this.dom.tblBody.appendChild(tr);
      this.renderPager(0);
      return;
    }

    const start = (this.state.currentPage - 1) * this.PAGE_SIZE;
    const pageData = this.state.filtered.slice(start, start + this.PAGE_SIZE);

    pageData.forEach((p, idx) => {
      const stt = start + idx + 1;
      const tthai = p.trangThai === 'cancelled'
        ? '<span class="tag t-err">Đã hủy</span>'
        : '<span class="tag t-ok">Hiệu lực</span>';

      // Base Data Row
      const tr = document.createElement('tr');
      tr.className = 'dsp-row';
      tr.dataset.id = p.soPhieu;
      tr.onclick = (e) => this.toggleDetail(p.soPhieu);
      tr.innerHTML = `
        <td onclick="event.stopPropagation()" style="text-align:center;white-space:nowrap">
          <button class="dsp-btn-xem" onclick="DsPhieuModule.xemPhieu(event, '${p.soPhieu}')">Xem</button>
          ${(this.state.docType !== 'khachtra' && p.trangThai !== 'cancelled') ? `<button class="dsp-btn-xoa" onclick="DsPhieuModule.xoaPhieu(event, '${p.soPhieu}')" style="margin-left:4px">Xóa</button>` : ''}
        </td>
        <td style="text-align:center;color:var(--text2)">${stt}</td>
        <td style="font-weight:700;color:var(--blue)">${p.soPhieu}</td>
        <td style="color:#ccc">${p.ngayNhap || '—'}</td>
        <td style="font-weight:500">${p.tenNCC || '—'}</td>
        <td style="text-align:right">${this.fmt(p.tongTien)}</td>
        <td style="text-align:right;color:var(--text2)">${this.fmt(p.chietKhau)}</td>
        <td style="text-align:right;color:var(--text2)">${this.fmt(p.vat)}</td>
        <td style="text-align:right;font-weight:700;color:#66bb6a">${this.fmt(p.tongCong)}</td>
        <td style="max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${p.ghiChu || ''}">${p.ghiChu || '—'}</td>
        <td>${p.nguoiNhap || 'admin'}</td>
        <td style="text-align:center">${tthai}</td>
      `;
      this.dom.tblBody.appendChild(tr);

      // Detail expansion sub-row
      const detailTr = document.createElement('tr');
      detailTr.id = 'dsp-detail-' + p.soPhieu;
      detailTr.style.display = 'none';
      detailTr.className = 'dsp-detail-wrap';
      detailTr.innerHTML = `
        <td colspan="12">
          <div class="dsp-detail-inner">
            <div class="dsp-detail-meta">
              <div class="dsp-dm-item"><div class="dsp-dm-lbl">Số hóa đơn</div><div class="dsp-dm-val">${p.soHoaDon || '—'}</div></div>
              <div class="dsp-dm-item"><div class="dsp-dm-lbl">Hình thức TT</div><div class="dsp-dm-val">${p.hinhThucTT || '—'}</div></div>
              <div class="dsp-dm-item"><div class="dsp-dm-lbl">Tiền đã thanh toán</div><div class="dsp-dm-val" style="color:#66bb6a;font-weight:700">${this.fmt(p.tienThanhToan)}</div></div>
              <div class="dsp-dm-item"><div class="dsp-dm-lbl">Ghi chú phiếu</div><div class="dsp-dm-val">${p.ghiChu || '—'}</div></div>
            </div>
            <div id="dsp-lines-${p.soPhieu}" style="color:var(--text2);font-size:var(--fs-2);font-style:italic">
              <span class="spin" style="width:14px;height:14px;border-color:#1e3a5f;border-top-color:#42a5f5"></span> Đang tải chi tiết dòng...
            </div>
          </div>
        </td>
      `;
      this.dom.tblBody.appendChild(detailTr);
    });

    this.renderPager(this.state.filtered.length);
  },

  toggleDetail(soPhieu) {
    const row = document.getElementById('dsp-detail-' + soPhieu);
    if (!row) return;
    const isOpen = row.style.display !== 'none';

    // Collapse all other detail rows first
    this.dom.tblBody.querySelectorAll('.dsp-detail-wrap').forEach(r => r.style.display = 'none');
    this.dom.tblBody.querySelectorAll('.dsp-row').forEach(r => r.classList.remove('expanded'));

    if (isOpen) {
      this.state.expandedRow = null;
      return; // If it was open, it's now closed
    }

    row.style.display = '';
    const mainRow = this.dom.tblBody.querySelector(`.dsp-row[data-id="${soPhieu}"]`);
    if (mainRow) mainRow.classList.add('expanded');
    this.state.expandedRow = soPhieu;

    // Load lines details if loading indicator is still shown
    const linesEl = document.getElementById('dsp-lines-' + soPhieu);
    if (linesEl && linesEl.textContent.includes('Đang tải')) {
      if (this.state.docType === 'khachtra') {
        ApiClient.call('apiKhachTraDetail', soPhieu)
          .then(res => {
            if (!res || !res.success) throw new Error((res && res.message) || 'Lỗi không xác định');
            this.renderLinesKhachTra(soPhieu, res.data.lines);
          })
          .catch(err => {
            linesEl.innerHTML = `<span style="color:var(--red);font-weight:bold">Không tải được chi tiết hàng: ${err.message}</span>`;
          });
        return;
      }
      PurchaseService.find(soPhieu)
        .then(ticket => {
          this.renderLines(soPhieu, ticket.lines);
        })
        .catch(err => {
          linesEl.innerHTML = `<span style="color:var(--red);font-weight:bold">Không tải được chi tiết hàng: ${err.message}</span>`;
        });
    }
  },

  // Sprint 12 — bảng chi tiết dòng cho Khách trả lại (field khác Purchase:
  // SoLuong/GiaBan/CK thay vì SL nhập/Giá nhập/%VAT, không có Giá lẻ).
  renderLinesKhachTra(soPhieu, lines) {
    const el = document.getElementById('dsp-lines-' + soPhieu);
    if (!el) return;
    if (!lines || !lines.length) {
      el.innerHTML = '<em style="color:var(--text2)">Phiếu không có chi tiết mặt hàng</em>';
      return;
    }
    el.innerHTML = `
      <table class="dsp-detail-tbl">
        <thead>
          <tr>
            <th style="width:40px;text-align:center">#</th>
            <th style="width:80px">Mã SP</th>
            <th>Tên sản phẩm</th>
            <th style="width:80px">ĐVT</th>
            <th style="width:90px">Số lô</th>
            <th style="width:100px">Hạn dùng</th>
            <th style="width:90px">Phiếu xuất gốc</th>
            <th style="width:80px;text-align:right">SL trả lại</th>
            <th style="width:100px;text-align:right">Giá bán</th>
            <th style="width:110px;text-align:right">Thành tiền</th>
            <th style="width:60px;text-align:center">%CK</th>
          </tr>
        </thead>
        <tbody>
          ${lines.map((l, i) => `
            <tr>
              <td style="text-align:center;color:var(--text2)">${i + 1}</td>
              <td style="color:#90caf9">${l.maSP || '—'}</td>
              <td style="font-weight:700">${l.tenSP || '—'}</td>
              <td>${l.dvt || '—'}</td>
              <td><span class="tag t-info">${l.soLo || '—'}</span></td>
              <td>${l.hanDung || '—'}</td>
              <td style="color:var(--text2)">${l.soPhieuGoc || '—'}</td>
              <td style="text-align:right">${this.fmt(l.soLuong)}</td>
              <td style="text-align:right">${this.fmt(l.giaBan)} ₫</td>
              <td style="text-align:right;font-weight:700;color:#66bb6a">${this.fmt(l.thanhTien)} ₫</td>
              <td style="text-align:center">${l.ck || 0}%</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  },

  renderLines(soPhieu, lines) {
    const el = document.getElementById('dsp-lines-' + soPhieu);
    if (!el) return;
    if (!lines || !lines.length) {
      el.innerHTML = '<em style="color:var(--text2)">Phiếu không có chi tiết mặt hàng</em>';
      return;
    }

    el.innerHTML = `
      <table class="dsp-detail-tbl">
        <thead>
          <tr>
            <th style="width:40px;text-align:center">#</th>
            <th style="width:80px">Mã SP</th>
            <th>Tên sản phẩm</th>
            <th style="width:80px">ĐVT</th>
            <th style="width:90px">Số lô</th>
            <th style="width:100px">Hạn dùng</th>
            <th style="width:80px;text-align:right">SL nhập</th>
            <th style="width:80px;text-align:right">SL Q.Đổi</th>
            <th style="width:100px;text-align:right">Giá nhập</th>
            <th style="width:100px;text-align:right">Giá lẻ</th>
            <th style="width:110px;text-align:right">Thành tiền</th>
            <th style="width:60px;text-align:center">%VAT</th>
          </tr>
        </thead>
        <tbody>
          ${lines.map((l, i) => `
            <tr>
              <td style="text-align:center;color:var(--text2)">${i + 1}</td>
              <td style="color:#90caf9">${l.maSP || '—'}</td>
              <td style="font-weight:700">${l.tenSP || '—'}</td>
              <td>${l.dvt || '—'}</td>
              <td><span class="tag t-info">${l.lo || '—'}</span></td>
              <td style="color:${this.getExpColor(l.hsd)}">${l.hsd || '—'}</td>
              <td style="text-align:right">${this.fmt(l.sl)}</td>
              <td style="text-align:right;color:var(--text2)">${this.fmt(l.sl * (l.heSo || 1))}</td>
              <td style="text-align:right">${this.fmt(l.donGia)} ₫</td>
              <td style="text-align:right;color:#66bb6a">${this.fmt(l.giaBanLe)} ₫</td>
              <td style="text-align:right;font-weight:700;color:#66bb6a">${this.fmt(l.thanhTien)} ₫</td>
              <td style="text-align:center">${l.vat || 0}%</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  },

  getExpColor(hsdStr) {
    if (!hsdStr || hsdStr === '—') return 'var(--text2)';
    const d = this.parseDate(hsdStr);
    if (!d) return 'var(--text2)';
    const days = Math.ceil((d - new Date()) / 864e5);
    if (days < 0) return '#ef5350'; // Expired (Red)
    if (days < 90) return '#ffcc02'; // Under 3 Months (Yellow)
    return '#a5d6a7'; // Safe (Green)
  },

  renderSummary() {
    // Only sum active (non-cancelled) invoices
    const activeTickets = this.state.filtered.filter(p => p.trangThai !== 'cancelled');
    const totalBefore = activeTickets.reduce((acc, p) => acc + (parseFloat(p.tongTien) || 0), 0);
    const totalCk = activeTickets.reduce((acc, p) => acc + (parseFloat(p.chietKhau) || 0), 0);
    const totalVat = activeTickets.reduce((acc, p) => acc + (parseFloat(p.vat) || 0), 0);
    const totalAfter = activeTickets.reduce((acc, p) => acc + (parseFloat(p.tongCong) || 0), 0);

    this.dom.sumTong.textContent = this.fmt(totalBefore);
    this.dom.sumCk.textContent = this.fmt(totalCk);
    this.dom.sumVat.textContent = this.fmt(totalVat);
    this.dom.sumTongcong.textContent = this.fmt(totalAfter);
  },

  renderPager(total) {
    const pages = Math.ceil(total / this.PAGE_SIZE);
    const info = this.dom.pgInfo;
    const btns = this.dom.pgBtns;
    if (!total) {
      info.textContent = 'Hiển thị 0–0 / 0 phiếu';
      btns.innerHTML = '';
      return;
    }
    const start = (this.state.currentPage - 1) * this.PAGE_SIZE + 1;
    const end = Math.min(this.state.currentPage * this.PAGE_SIZE, total);
    info.textContent = `Tổng số bản ghi: ${total} - Tổng số trang: ${pages} (Hiển thị ${start}–${end})`;
    
    let html = `<button class="dsp-pg-btn" onclick="DsPhieuModule.gotoPage(${this.state.currentPage - 1})" ${this.state.currentPage === 1 ? 'disabled' : ''}>‹</button>`;
    const from = Math.max(1, this.state.currentPage - 2);
    const to = Math.min(pages, from + 4);
    for (let i = from; i <= to; i++) {
      html += `<button class="dsp-pg-btn${i === this.state.currentPage ? ' on' : ''}" onclick="DsPhieuModule.gotoPage(${i})">${i}</button>`;
    }
    html += `<button class="dsp-pg-btn" onclick="DsPhieuModule.gotoPage(${this.state.currentPage + 1})" ${this.state.currentPage === pages ? 'disabled' : ''}>›</button>`;
    btns.innerHTML = html;
  },

  gotoPage(p) {
    const maxPage = Math.ceil(this.state.filtered.length / this.PAGE_SIZE);
    if (p < 1 || p > maxPage) return;
    this.state.currentPage = p;
    this.renderTable();
    const wrap = document.querySelector('.dsp-tbl-wrap');
    if (wrap) wrap.scrollTop = 0;
  },

  xemPhieu(e, soPhieu) {
    if (e) e.stopPropagation();
    if (this.state.docType === 'khachtra') {
      // Sprint 12 (evidence "...Cách xem lại phiếu khách trả lại...pdf"):
      // mở lại ở mod_khachtra.html, READ-ONLY (không có Sửa/Xóa — RETURN-DEC-P006 PENDING).
      goPage('khachtra');
      if (typeof KhachTraModule !== 'undefined' && typeof KhachTraModule.openExisting === 'function') {
        KhachTraModule.openExisting(soPhieu);
      }
      return;
    }
    goPage('nhaphang');
    if (typeof NhaphangModule !== 'undefined' && typeof NhaphangModule.moPhieu === 'function') {
      NhaphangModule.moPhieu(soPhieu);
    }
  },

  xoaPhieu(e, soPhieu) {
    if (e) e.stopPropagation();
    // RETURN-DEC-P006 PENDING — Khách trả lại chưa có nghiệp vụ hủy phiếu,
    // nút Xóa không render cho docType này (xem renderTable); guard đây chỉ
    // để phòng gọi nhầm.
    if (this.state.docType === 'khachtra') return;
    window.showConfirm(`Bạn có chắc chắn muốn hủy phiếu nhập "${soPhieu}" không? Hành động này sẽ cập nhật trạng thái phiếu về "Đã hủy" và không thể hoàn tác!`, 'Xác nhận hủy phiếu')
      .then(ok => {
        if (ok) {
          showLoading();
          PurchaseService.remove(soPhieu)
            .then(() => {
              hideLoading();
              toast(`Đã hủy phiếu ${soPhieu} thành công!`, 'ok');
              // Reload both modules caches
              this.loadData();
              if (typeof NhaphangModule !== 'undefined' && typeof NhaphangModule.loadTicketsBg === 'function') {
                NhaphangModule.loadTicketsBg(true);
              }
            })
            .catch(err => {
              hideLoading();
              toast('Lỗi hủy phiếu: ' + err.message, 'err');
            });
        }
      });
  },

  openNewEditor() {
    if (this.state.docType === 'khachtra') {
      goPage('khachtra');
      return;
    }
    goPage('nhaphang');
    if (typeof NhaphangModule !== 'undefined' && typeof NhaphangModule.lamMoi === 'function') {
      NhaphangModule.lamMoi();
    }
  },

  fmt(v) {
    const n = parseFloat(v) || 0;
    if (n === 0) return '0';
    return Math.round(n).toLocaleString('vi-VN');
  }
};
</script>
