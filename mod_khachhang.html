<style>
#page-khachhang {
  display: none;
  height: calc(100vh - 52px);
  min-height: 0;
  overflow: hidden;
}
#page-khachhang.show {
  display: flex;
}

.kh-sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  flex-shrink: 0;
}

.kh-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.kh-sb-lbl {
  font-size: var(--fs-1);
  color: var(--text2);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-bottom: 3px;
}

.kh-sb-sel,
.kh-sb-inp {
  width: 100%;
  height: var(--h-4);
  padding: 0 8px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 4px;
  color: var(--text);
  font-size: var(--fs-3);
}
.kh-sb-sel:focus,
.kh-sb-inp:focus { outline: none; border-color: #1976D2; }

.kh-sb-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

.kh-topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 10px;
  flex-wrap: wrap;
  position: relative;
}

.kh-topbar-left {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.kh-topbar-right {
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--text2);
}

.kh-check-lbl {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-2);
  color: var(--text);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.kh-check-lbl input[type=checkbox] { accent-color: var(--blue); }
.kh-check-lbl.kh-disabled { color: var(--text2); cursor: not-allowed; opacity: .6; }

.kh-icon-btn {
  padding: 0 8px;
  height: var(--h-4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.kh-icon-btn[disabled] { opacity: .4; cursor: not-allowed; }

/* Panel ẩn/hiện cột — theo đúng pattern mod_dsphieuxuat.html */
.kh-colpanel {
  position: absolute;
  top: calc(100% + 4px);
  left: 10px;
  background: #0d2347;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  z-index: 500;
  display: none;
  min-width: 200px;
  max-height: 320px;
  overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,.55);
}
.kh-colpanel.open { display: block; }
.kh-colpanel label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  font-size: var(--fs-2);
  color: var(--text);
  cursor: pointer;
  border-radius: 3px;
}
.kh-colpanel label:hover { background: #112244; }
.kh-colpanel input[type=checkbox] { accent-color: var(--green); }

.kh-tbl-wrap {
  flex: 1;
  overflow: auto;
  border: 1px solid var(--border);
  margin: 10px 12px;
  border-radius: 6px;
  background: var(--bg2);
}

.kh-tbl {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
  table-layout: fixed;
}

.kh-tbl th {
  background: #0a2040;
  color: var(--text2);
  padding: 8px 10px;
  text-align: left;
  font-size: var(--fs-1);
  font-weight: 700;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

.kh-tbl tbody tr.kh-row {
  border-bottom: 1px solid #0d1f3c;
  transition: background .1s;
}
.kh-tbl tbody tr.kh-row:hover { background: #0d2347; }

.kh-tbl td {
  padding: 8px 10px;
  font-size: var(--fs-2);
  color: var(--text);
  border-right: 1px solid #0d1f3c;
  vertical-align: middle;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.kh-tbl td:last-child { border-right: none; }

.kh-row-actions { display: flex; gap: 4px; justify-content: center; }

.kh-pager {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.kh-pg-info { font-size: var(--fs-2); color: var(--text2); }
.kh-pg-btns { display: flex; gap: 4px; }
.kh-pg-btn {
  width: var(--h-2);
  height: var(--h-2);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text2);
  border-radius: 4px;
  cursor: pointer;
  font-size: var(--fs-2);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.kh-pg-btn:hover { background: var(--border); color: #fff; }
.kh-pg-btn.on { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
.kh-pg-btn:disabled { opacity: .3; cursor: not-allowed; }
</style>

<script>
// ════════════════════════════════════════════════════════════════
//  CONTROLLER LAYER: KhachHangModule (mod_khachhang.html)
//  Sprint 7.0 — Danh mục Khách hàng
// ════════════════════════════════════════════════════════════════
const KhachHangModule = {
  PAGE_SIZE: 20,

  // SĐT/Ngày sinh/Địa chỉ luôn hiển thị (không có trong panel ẩn/hiện cột
  // của TheLight thật — xem header cố định ở HTML).
  //
  // Cột ẩn/hiện được — đúng 7 cột + đúng trạng thái mặc định (checked/
  // unchecked) như panel ẩn/hiện cột thật của TheLight (ảnh PO gửi), cộng
  // thêm "Công nợ" (PO quyết định giữ lại dù TheLight không có cột này,
  // mặc định TẮT để không phá giao diện gốc — bật lên khi cần xem nhanh
  // mà không phải mở dialog "Công nợ tồn đầu" từng khách một).
  COLUMNS: [
    { key: 'canNang',            label: 'Cân nặng',               width: 90,  defaultVisible: false },
    { key: 'diemTL',             label: 'Điểm tích lũy',          width: 100, num: true, defaultVisible: true },
    { key: 'diemSuDung',         label: 'Điểm sử dụng',           width: 100, num: true, defaultVisible: false },
    { key: 'diemConLai',         label: 'Điểm còn lại',           width: 100, num: true, defaultVisible: true },
    { key: 'email',              label: 'Email',                  width: 160, defaultVisible: false },
    { key: 'daCaiApp',           label: 'App tích điểm',          width: 110, bool: true, defaultVisible: true },
    { key: 'thoiDiemGuiThongBao',label: 'Thời điểm gửi thông báo',width: 150, defaultVisible: false },
    // Sprint 14 (PO Decision #2, 2026-08-14): key đổi sang `currentDebt`
    // (Current Debt tính động qua DebtEngineBackend) — KHÔNG còn đọc
    // `congNo` thô (đó chỉ là Opening Debt). Cột hiển thị vẫn tên "Công nợ".
    { key: 'currentDebt',        label: 'Công nợ',                width: 100, num: true, defaultVisible: true }
  ],

  state: {
    allData: [],
    filtered: [],
    currentPage: 1,
    visibleCols: {}
  },

  dom: {},
  initialized: false,

  init() {
    if (this.initialized) return;
    this.COLUMNS.forEach(c => { this.state.visibleCols[c.key] = c.defaultVisible !== false; });
    this.cacheDOM();
    this.fillDayOptions_();
    this.renderColPanel();
    this.renderHeadRow();
    this.bindEvents();
    this.initialized = true;
  },

  cacheDOM() {
    this.dom = {
      fMonth:     document.getElementById('kh-f-month'),
      fDayFrom:   document.getElementById('kh-f-dayfrom'),
      fDayTo:     document.getElementById('kh-f-dayto'),
      search:     document.getElementById('kh-search'),
      xemConNo:   document.getElementById('kh-chk-xemconno'),
      sortDiem:   document.getElementById('kh-chk-sort-diem'),
      btnSearch:  document.getElementById('kh-btn-search'),
      btnReload:  document.getElementById('kh-btn-reload'),
      btnAdd:     document.getElementById('kh-btn-add'),
      btnCols:    document.getElementById('kh-btn-cols'),
      btnExport:  document.getElementById('kh-btn-export'),
      colPanel:   document.getElementById('kh-colpanel'),
      theadRow:   document.getElementById('kh-thead-row'),
      tblBody:    document.getElementById('kh-tbl-body'),
      pgInfo:     document.getElementById('kh-pg-info'),
      pgBtns:     document.getElementById('kh-pg-btns')
    };
  },

  fillDayOptions_() {
    const opts = [];
    for (let d = 1; d <= 31; d++) opts.push(`<option value="${d}">${d}</option>`);
    this.dom.fDayFrom.innerHTML = opts.join('');
    this.dom.fDayTo.innerHTML = opts.join('');
    this.dom.fDayFrom.value = '1';
    this.dom.fDayTo.value = '31';
  },

  renderColPanel() {
    this.dom.colPanel.innerHTML = this.COLUMNS.map(c => `
      <label>
        <input type="checkbox" data-col="${c.key}" ${this.state.visibleCols[c.key] ? 'checked' : ''}
               onchange="KhachHangModule.toggleColumn('${c.key}', this.checked)">
        ${c.label}
      </label>
    `).join('');
  },

  toggleColumn(key, visible) {
    this.state.visibleCols[key] = visible;
    this.renderHeadRow();
    this.renderTable();
  },

  visibleColumns_() {
    return this.COLUMNS.filter(c => this.state.visibleCols[c.key] !== false);
  },

  renderHeadRow() {
    const cols = this.visibleColumns_();
    this.dom.theadRow.innerHTML = `
      <th style="width:44px;text-align:center">STT</th>
      <th style="width:100px">Mã KH</th>
      <th style="width:160px">Tên khách hàng</th>
      <th style="width:120px">SĐT</th>
      <th style="width:100px">Ngày sinh</th>
      <th style="width:180px">Địa chỉ</th>
      ${cols.map(c => `<th style="width:${c.width}px${c.num ? ';text-align:right' : ''}">${c.label}</th>`).join('')}
      <th style="width:250px;text-align:center">Thao tác</th>
    `;
  },

  bindEvents() {
    this.dom.search.oninput = () => this.applyFilter();
    this.dom.sortDiem.onchange = () => this.applyFilter();
    this.dom.xemConNo.onchange = () => this.applyFilter();
    this.dom.fMonth.onchange = () => this.applyFilter();
    this.dom.fDayFrom.onchange = () => this.applyFilter();
    this.dom.fDayTo.onchange = () => this.applyFilter();
    this.dom.btnSearch.onclick = () => this.applyFilter();
    this.dom.btnReload.onclick = () => this.loadData();
    this.dom.btnAdd.onclick = () => this.openAdd();
    this.dom.btnCols.onclick = (e) => { e.stopPropagation(); this.dom.colPanel.classList.toggle('open'); };
    this.dom.btnExport.onclick = () => this.exportCsv();

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.kh-colpanel') && !e.target.closest('#kh-btn-cols')) {
        this.dom.colPanel.classList.remove('open');
      }
    });
  },

  loadData() {
    this.renderLoading();
    CustomerService.load()
      .then(list => {
        this.state.allData = list || [];
        this.applyFilter();
      })
      .catch(err => {
        this.renderError(err.message);
      });
  },

  applyFilter() {
    const q = (this.dom.search.value || '').toLowerCase().trim();
    const month = this.dom.fMonth.value;
    const dayFrom = Number(this.dom.fDayFrom.value) || 1;
    const dayTo = Number(this.dom.fDayTo.value) || 31;

    let result = this.state.allData.filter(c => {
      if (q && ![c.tenKH, c.sdt, c.maKH].join(' ').toLowerCase().includes(q)) return false;

      // Tìm sinh nhật: NgaySinh (yyyy-MM-dd) trùng Tháng đã chọn, ngày trong
      // khoảng Từ ngày–Đến ngày. Bỏ qua năm sinh.
      if (month) {
        if (!c.ngaySinh) return false;
        const m = String(c.ngaySinh).match(/^\d{4}-(\d{2})-(\d{2})$/);
        if (!m) return false;
        const cMonth = Number(m[1]);
        const cDay = Number(m[2]);
        if (cMonth !== Number(month)) return false;
        if (cDay < dayFrom || cDay > dayTo) return false;
      }

      return true;
    });

    // PO Decision #1 (Sprint 14, 2026-08-14): "Xem khách còn nợ" = filter
    // trên grid Customer có sẵn (KHÔNG tạo màn riêng) — chỉ hiện khách có
    // Current Debt > 0. Dùng ĐÚNG `currentDebt` (tính động qua
    // DebtEngineBackend, đã gộp sẵn vào apiCustomerLoad) — KHÔNG dùng
    // `congNo` thô (đó chỉ là Opening Debt, xem PO Decision #2).
    if (this.dom.xemConNo.checked) {
      result = result.filter(c => (Number(c.currentDebt) || 0) > 0);
    }

    // BR-CUS-07: Sắp xếp tích điểm KH — điểm tích lũy cao nhất trước.
    if (this.dom.sortDiem.checked) {
      result = result.slice().sort((a, b) => (Number(b.diemTL) || 0) - (Number(a.diemTL) || 0));
    }

    this.state.filtered = result;
    this.state.currentPage = 1;
    this.renderTable();
  },

  colspan_() { return this.visibleColumns_().length + 7; },

  renderLoading() {
    this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">
      <span class="spin"></span> Đang tải danh mục khách hàng...
    </td></tr>`;
  },

  renderError(msg) {
    this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--red);font-weight:bold">
      Lỗi tải dữ liệu: ${msg}
    </td></tr>`;
  },

  renderTable() {
    if (!this.state.filtered.length) {
      this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">Không tìm thấy khách hàng nào</td></tr>`;
      this.renderPager(0);
      return;
    }

    const cols = this.visibleColumns_();
    const start = (this.state.currentPage - 1) * this.PAGE_SIZE;
    const pageData = this.state.filtered.slice(start, start + this.PAGE_SIZE);

    this.dom.tblBody.innerHTML = pageData.map((c, idx) => {
      const stt = start + idx + 1;
      return `
        <tr class="kh-row">
          <td style="text-align:center;color:var(--text2)">${stt}</td>
          <td>${c.maKH || '—'}</td>
          <td title="${c.tenKH || ''}">${c.tenKH || '—'}</td>
          <td>${c.sdt || '—'}</td>
          <td>${this.fmtDateDisplay_(c.ngaySinh)}</td>
          <td title="${c.diaChi || ''}">${c.diaChi || '—'}</td>
          ${cols.map(col => `<td style="${col.num ? 'text-align:right' : ''}">${this.cellHtml_(c, col)}</td>`).join('')}
          <td>
            <div class="kh-row-actions">
              <button class="btn btn-orange btn-sm" onclick="KhachHangModule.openDebt('${c.maKH}')">Công nợ tồn đầu</button>
              <button class="btn btn-green btn-sm" onclick="KhachHangModule.openEdit('${c.maKH}')">Sửa</button>
              <button class="btn btn-red btn-sm" onclick="KhachHangModule.confirmDelete('${c.maKH}')">Xóa</button>
            </div>
          </td>
        </tr>`;
    }).join('');

    this.renderPager(this.state.filtered.length);
  },

  cellHtml_(c, col) {
    if (col.key === 'ngaySinh') return this.fmtDateDisplay_(c.ngaySinh);
    if (col.bool) return c[col.key] ? '☑ Đã cài' : '☐ Đã cài';
    if (col.num) return this.fmtNum_(c[col.key]);
    return c[col.key] || '—';
  },

  cellText_(c, col) {
    if (col.key === 'ngaySinh') return this.fmtDateDisplay_(c.ngaySinh);
    if (col.bool) return c[col.key] ? 'Đã cài' : '';
    if (col.num) return this.fmtNum_(c[col.key]);
    return c[col.key] || '';
  },

  renderPager(total) {
    const pages = Math.ceil(total / this.PAGE_SIZE);
    if (!total) {
      this.dom.pgInfo.textContent = 'Hiển thị 0–0 / 0 khách hàng';
      this.dom.pgBtns.innerHTML = '';
      return;
    }
    const start = (this.state.currentPage - 1) * this.PAGE_SIZE + 1;
    const end = Math.min(this.state.currentPage * this.PAGE_SIZE, total);
    this.dom.pgInfo.textContent = `Tổng số bản ghi: ${total} - Tổng số trang: ${pages} (Hiển thị ${start}–${end})`;

    let html = `<button class="kh-pg-btn" onclick="KhachHangModule.gotoPage(${this.state.currentPage - 1})" ${this.state.currentPage === 1 ? 'disabled' : ''}>‹</button>`;
    const from = Math.max(1, this.state.currentPage - 2);
    const to = Math.min(pages, from + 4);
    for (let i = from; i <= to; i++) {
      html += `<button class="kh-pg-btn${i === this.state.currentPage ? ' on' : ''}" onclick="KhachHangModule.gotoPage(${i})">${i}</button>`;
    }
    html += `<button class="kh-pg-btn" onclick="KhachHangModule.gotoPage(${this.state.currentPage + 1})" ${this.state.currentPage === pages ? 'disabled' : ''}>›</button>`;
    this.dom.pgBtns.innerHTML = html;
  },

  gotoPage(p) {
    const maxPage = Math.ceil(this.state.filtered.length / this.PAGE_SIZE);
    if (p < 1 || p > maxPage) return;
    this.state.currentPage = p;
    this.renderTable();
    const wrap = document.querySelector('.kh-tbl-wrap');
    if (wrap) wrap.scrollTop = 0;
  },

  openAdd() {
    CustomerEditor.open({
      mode: 'create',
      onSaved: () => this.loadData()
    });
  },

  openEdit(maKH) {
    CustomerEditor.open({
      mode: 'edit',
      maKH: maKH,
      onSaved: () => this.loadData()
    });
  },

  openDebt(maKH) {
    const c = this.state.allData.find(x => x.maKH === maKH);
    CustomerDebtEditor.open({
      maKH: maKH,
      tenKH: c ? c.tenKH : '',
      congNoHienTai: c ? c.congNo : 0,
      onSaved: () => this.loadData()
    });
  },

  // Xóa khách hàng — soft-delete (Active=false), có xác nhận trước.
  confirmDelete(maKH) {
    const c = this.state.allData.find(x => x.maKH === maKH);
    const ten = c ? c.tenKH : maKH;
    if (typeof window.showConfirm === 'function') {
      window.showConfirm(`Bạn có chắc chắn muốn xóa khách hàng "${ten}" không?`, 'Xác nhận xóa khách hàng')
        .then(ok => { if (ok) this.doDelete_(maKH); });
    } else if (confirm(`Bạn có chắc chắn muốn xóa khách hàng "${ten}" không?`)) {
      this.doDelete_(maKH);
    }
  },

  doDelete_(maKH) {
    CustomerService.remove(maKH)
      .then(() => {
        toast('Đã xóa khách hàng', 'ok');
        this.loadData();
      })
      .catch(err => {
        toast(err.message || 'Lỗi xóa khách hàng', 'err');
      });
  },

  // ── Xuất CSV — cùng cơ chế với mod_dsphieuxuat.html (không có thư viện
  // tạo file .xlsx nhị phân sẵn có trong dự án) — xuất đúng danh sách đang
  // lọc/sắp xếp hiện tại, đúng các cột đang hiển thị trên Grid.
  exportCsv() {
    if (!this.state.filtered.length) { toast('Không có dữ liệu để xuất!', 'warn'); return; }
    const cols = this.visibleColumns_();
    const esc = v => {
      v = (v === null || v === undefined) ? '' : String(v);
      if (v.includes(',') || v.includes('"') || v.includes('\n')) {
        v = '"' + v.replace(/"/g, '""') + '"';
      }
      return v;
    };
    const header = ['STT', 'Mã KH', 'Tên khách hàng', 'SĐT', 'Ngày sinh', 'Địa chỉ'].concat(cols.map(c => c.label)).map(esc).join(',');
    const rows = this.state.filtered.map((c, idx) => {
      const cells = [idx + 1, c.maKH, c.tenKH, c.sdt, this.fmtDateDisplay_(c.ngaySinh), c.diaChi].concat(cols.map(col => this.cellText_(c, col)));
      return cells.map(esc).join(',');
    });
    const BOM = '﻿';
    const csv = BOM + header + '\n' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `DanhSachKhachHang_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  // Chuyển "yyyy-MM-dd" (từ <input type="date">) sang "dd/MM/yyyy" để hiển thị,
  // đúng quy ước hiển thị ngày dùng chung toàn app.
  fmtDateDisplay_(iso) {
    if (!iso) return '—';
    const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return iso;
    return `${m[3]}/${m[2]}/${m[1]}`;
  },

  fmtNum_(v) {
    const n = Number(v) || 0;
    return n.toLocaleString('vi-VN');
  }
};
</script>
