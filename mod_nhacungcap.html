      sidebar filter (khác Customer) — chỉ 1 ô Tìm kiếm + nút Tìm kiếm ở
      topbar. Toolbar: "+ Thêm mới" + 4 icon (Tải mẫu Excel/Nhập Excel/
      icon không rõ/Xuất Excel — tất cả disabled, Pending PO — xem PO
      Review Sprint 8.0). Per-row: "Công nợ tồn đầu"/"Xóa" disabled
      (Pending PO — KHÔNG suy đoán Hard/Soft Delete hay data model công
      nợ từ Customer). Chỉ "Sửa" hoạt động, dùng lại NccEditor có sẵn.
     ════════════════════════════════════════════════════════════════ -->

<style>
#page-nhacungcap {
  display: none;
  height: calc(100vh - 52px);
  min-height: 0;
  overflow: hidden;
  flex-direction: column;
}
#page-nhacungcap.show {
  display: flex;
}

.ncl-topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 10px;
  flex-wrap: wrap;
}

.ncl-topbar-left {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.ncl-topbar-right {
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--text2);
}

.ncl-inp-search {
  height: var(--h-4);
  padding: 0 8px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 4px;
  color: var(--text);
  font-size: var(--fs-3);
  width: 260px;
}
.ncl-inp-search:focus { outline: none; border-color: #1976D2; }

.ncl-icon-btn {
  padding: 0 8px;
  height: var(--h-4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.ncl-icon-btn[disabled] { opacity: .4; cursor: not-allowed; }

.ncl-tbl-wrap {
  flex: 1;
  overflow: auto;
  border: 1px solid var(--border);
  margin: 10px 12px;
  border-radius: 6px;
  background: var(--bg2);
}

.ncl-tbl {
  width: 100%;
  border-collapse: collapse;
  min-width: 950px;
  table-layout: fixed;
}

.ncl-tbl th {
  background: #0a2040;
  color: var(--text2);
  padding: 8px 10px;
  text-align: left;
  font-size: var(--fs-1);
  font-weight: 700;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.ncl-tbl th:last-child { border-right: none; }

.ncl-tbl tbody tr.ncl-row {
  border-bottom: 1px solid #0d1f3c;
  transition: background .1s;
}
.ncl-tbl tbody tr.ncl-row:hover { background: #0d2347; }

.ncl-tbl td {
  padding: 8px 10px;
  font-size: var(--fs-2);
  color: var(--text);
  border-right: 1px solid #0d1f3c;
  vertical-align: middle;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ncl-tbl td:last-child { border-right: none; }

.ncl-row-actions { display: flex; gap: 4px; justify-content: center; }

.ncl-pager {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.ncl-pg-info { font-size: var(--fs-2); color: var(--text2); }
.ncl-pg-btns { display: flex; gap: 4px; }
.ncl-pg-btn {
  width: var(--h-2);
  height: var(--h-2);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text2);
  border-radius: 4px;
  cursor: pointer;
  font-size: var(--fs-2);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.ncl-pg-btn:hover { background: var(--border); color: #fff; }
.ncl-pg-btn.on { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
.ncl-pg-btn:disabled { opacity: .3; cursor: not-allowed; }
</style>

<div class="page" id="page-nhacungcap">
  <div class="ncl-topbar">
    <div class="ncl-topbar-left">
      <input id="ncl-search" class="ncl-inp-search" placeholder="Tìm kiếm...">
      <button class="btn btn-green" id="ncl-btn-search">Tìm kiếm</button>
      <button class="btn btn-green" id="ncl-btn-add">＋ Thêm mới</button>
      <button class="btn btn-gray ncl-icon-btn" disabled title="Chưa hỗ trợ — Tải mẫu nhập Excel đang chờ Product Owner cung cấp schema (Pending PO Decision)">📄</button>
      <button class="btn btn-gray ncl-icon-btn" disabled title="Chưa hỗ trợ — Nhập danh sách NCC bằng Excel đang chờ Product Owner cung cấp schema/quy tắc (Pending PO Decision)">📥</button>
      <button class="btn btn-gray ncl-icon-btn" disabled title="Chưa xác định chức năng — Evidence Required (icon không có caption trong tài liệu tham chiếu TheLight)">☰</button>
      <button class="btn btn-gray ncl-icon-btn" disabled title="Chưa hỗ trợ — định dạng Xuất Excel đang chờ Product Owner xác nhận (Pending PO Decision)">📤</button>
    </div>
    <div class="ncl-topbar-right">Danh sách nhà cung cấp</div>
  </div>

  <div class="ncl-tbl-wrap">
    <table class="ncl-tbl" id="ncl-main-tbl">
      <thead>
        <tr>
          <th style="width:44px;text-align:center">STT</th>
          <th style="width:100px">Mã NCC</th>
          <th style="width:200px">Tên NCC</th>
          <th style="width:220px">Địa chỉ</th>
          <th style="width:120px">Điện thoại</th>
          <th style="width:180px">Ghi chú</th>
          <th style="width:110px;text-align:right">Công nợ</th>
          <th style="width:230px;text-align:center">Thao tác</th>
        </tr>
      </thead>
      <tbody id="ncl-tbl-body"></tbody>
    </table>
  </div>

  <div class="ncl-pager">
    <div class="ncl-pg-info" id="ncl-pg-info">—</div>
    <div class="ncl-pg-btns" id="ncl-pg-btns"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  CONTROLLER LAYER: NhaCungCapModule (mod_nhacungcap.html)
//  Sprint 8.0 — Danh mục Nhà cung cấp
// ════════════════════════════════════════════════════════════════
const NhaCungCapModule = {
  PAGE_SIZE: 20,

  state: {
    allData: [],
    filtered: [],
    currentPage: 1
  },

  dom: {},
  initialized: false,

  init() {
    if (this.initialized) return;
    this.cacheDOM();
    this.bindEvents();
    this.initialized = true;
  },

  cacheDOM() {
    this.dom = {
      search:    document.getElementById('ncl-search'),
      btnSearch: document.getElementById('ncl-btn-search'),
      btnAdd:    document.getElementById('ncl-btn-add'),
      tblBody:   document.getElementById('ncl-tbl-body'),
      pgInfo:    document.getElementById('ncl-pg-info'),
      pgBtns:    document.getElementById('ncl-pg-btns')
    };
  },

  bindEvents() {
    this.dom.search.oninput = () => this.applyFilter();
    this.dom.btnSearch.onclick = () => this.applyFilter();
    this.dom.btnAdd.onclick = () => this.openAdd();
  },

  loadData() {
    this.renderLoading();
    // PERF FIX (2026-08-17): dùng apiNccLoadWithDebt (chỉ màn này cần cột
    // "Công nợ") thay vì apiNccLoad — xem backend_ncc_service.gs.
    ApiClient.call('apiNccLoadWithDebt')
      .then(res => {
        if (!res || !res.success) {
          this.renderError((res && res.message) || 'Lỗi không xác định');
          return;
        }
        this.state.allData = res.data || [];
        this.applyFilter();
      })
      .catch(err => {
        this.renderError(err.message);
      });
  },

  // BR-NCC-03: PDF chỉ xác nhận có ô + nút Tìm kiếm, không xác định tìm
  // theo field nào/gần đúng hay chính xác/realtime hay submit. Tạm áp
  // dụng: tìm gần đúng trên Mã NCC + Tên NCC + Điện thoại, submit qua nút
  // hoặc gõ trực tiếp (không phải hành vi TheLight đã xác minh — cần PO
  // xác nhận nếu khác).
  applyFilter() {
    const q = (this.dom.search.value || '').toLowerCase().trim();
    this.state.filtered = this.state.allData.filter(n => {
      if (!q) return true;
      return [n.tenNCC, n.maNCC, n.sdt].join(' ').toLowerCase().includes(q);
    });
    this.state.currentPage = 1;
    this.renderTable();
  },

  colspan_() { return 8; },

  fmt_(v) {
    const n = Math.round(Number(v) || 0);
    return n.toLocaleString('vi-VN');
  },

  renderLoading() {
    this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">
      <span class="spin"></span> Đang tải danh mục nhà cung cấp...
    </td></tr>`;
  },

  renderError(msg) {
    this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--red);font-weight:bold">
      Lỗi tải dữ liệu: ${msg}
    </td></tr>`;
  },

  renderTable() {
    if (!this.state.filtered.length) {
      this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">Không tìm thấy nhà cung cấp nào</td></tr>`;
      this.renderPager(0);
      return;
    }

    const start = (this.state.currentPage - 1) * this.PAGE_SIZE;
    const pageData = this.state.filtered.slice(start, start + this.PAGE_SIZE);

    this.dom.tblBody.innerHTML = pageData.map((n, idx) => {
      const stt = start + idx + 1;
      return `
        <tr class="ncl-row">
          <td style="text-align:center;color:var(--text2)">${stt}</td>
          <td>${n.maNCC || '—'}</td>
          <td title="${n.tenNCC || ''}">${n.tenNCC || '—'}</td>
          <td title="${n.diaChi || ''}">${n.diaChi || '—'}</td>
          <td>${n.sdt || '—'}</td>
          <td title="${n.ghiChu || ''}">${n.ghiChu || '—'}</td>
          <td style="text-align:right">${this.fmt_(n.currentDebt)}</td>
          <td>
            <div class="ncl-row-actions">
              <button class="btn btn-orange btn-sm" onclick="NhaCungCapModule.openDebt('${n.maNCC}')">Công nợ tồn đầu</button>
              <button class="btn btn-green btn-sm" onclick="NhaCungCapModule.openEdit('${n.maNCC}')">Sửa</button>
              <button class="btn btn-red btn-sm" disabled title="Chưa hỗ trợ — hành vi Xóa (Soft/Hard Delete) chưa được Product Owner xác nhận (Pending PO Decision, không suy đoán từ module Khách hàng)">Xóa</button>
            </div>
          </td>
        </tr>`;
    }).join('');

    this.renderPager(this.state.filtered.length);
  },

  renderPager(total) {
    const pages = Math.ceil(total / this.PAGE_SIZE);
    if (!total) {
      this.dom.pgInfo.textContent = 'Hiển thị 0–0 / 0 nhà cung cấp';
      this.dom.pgBtns.innerHTML = '';
      return;
    }
    const start = (this.state.currentPage - 1) * this.PAGE_SIZE + 1;
    const end = Math.min(this.state.currentPage * this.PAGE_SIZE, total);
    this.dom.pgInfo.textContent = `Tổng số bản ghi: ${total} - Tổng số trang: ${pages} (Hiển thị ${start}–${end})`;

    let html = `<button class="ncl-pg-btn" onclick="NhaCungCapModule.gotoPage(${this.state.currentPage - 1})" ${this.state.currentPage === 1 ? 'disabled' : ''}>‹</button>`;
    const from = Math.max(1, this.state.currentPage - 2);
    const to = Math.min(pages, from + 4);
    for (let i = from; i <= to; i++) {
      html += `<button class="ncl-pg-btn${i === this.state.currentPage ? ' on' : ''}" onclick="NhaCungCapModule.gotoPage(${i})">${i}</button>`;
    }
    html += `<button class="ncl-pg-btn" onclick="NhaCungCapModule.gotoPage(${this.state.currentPage + 1})" ${this.state.currentPage === pages ? 'disabled' : ''}>›</button>`;
    this.dom.pgBtns.innerHTML = html;
  },

  gotoPage(p) {
    const maxPage = Math.ceil(this.state.filtered.length / this.PAGE_SIZE);
    if (p < 1 || p > maxPage) return;
    this.state.currentPage = p;
    this.renderTable();
    const wrap = document.querySelector('.ncl-tbl-wrap');
    if (wrap) wrap.scrollTop = 0;
  },

  // Thêm/Sửa dùng lại nguyên NccEditor đã có (dialog_ncc_editor.html) —
  // không viết dialog mới, đúng nguyên tắc reuse.
  openAdd() {
    NccEditor.open({
      mode: 'create',
      onSaved: () => this.loadData()
    });
  },

  openEdit(maNCC) {
    NccEditor.open({
      mode: 'edit',
      nccId: maNCC,
      onSaved: () => this.loadData()
    });
  },

  // Sprint 14 (Thu Chi & Công Nợ) — bật lại nút "Công nợ tồn đầu" (trước
  // đó disabled/Pending Sprint 8.0), evidence PDF đã xác nhận
  // (`Thu_Chi_cong_no_ton_dau.pdf`). Dialog SET (ghi đè) Opening Debt —
  // KHÁC với cột "Công nợ" hiển thị trên grid (đó là Current Debt tính
  // động, xem backend_debtengine_service.gs) — không truyền nhầm 2 số.
  openDebt(maNCC) {
    const n = this.state.allData.find(x => x.maNCC === maNCC);
    if (!n) return;
    NccDebtEditor.open({
      maNCC: n.maNCC,
      tenNCC: n.tenNCC,
      congNoHienTai: n.congNo,
      onSaved: () => this.loadData()
    });
  }
};
</script>
