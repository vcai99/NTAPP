<!-- ════════════════════════════════════════════════════════════════
      QUẢN LÝ THU CHI MODULE (mod_thuchi.html)
      Sprint 14 — Thu Chi & Công Nợ
      Theo evidence PDF (docs/14. Quan_ly_Thu_chi/):
      Tạo phiếu → Quản lý thu chi → "+ Thu chi công nợ" → Thu/Chi →
      Đối tượng → HTTT → Số tiền → Lưu.

      "+ Thu chi khác" (nút riêng trong ảnh evidence) — CHƯA có evidence
      chi tiết (không phải giao dịch công nợ) — render disabled + tooltip
      Pending, không tự suy đoán chức năng (đúng nguyên tắc dự án).
     ════════════════════════════════════════════════════════════════ -->

<style>
#page-thuchi { display: none; height: calc(100vh - 52px); min-height: 0; overflow: hidden; }
#page-thuchi.show { display: flex; }

.tc-sidebar {
  width: 220px; min-width: 220px; background: var(--bg2); border-right: 1px solid var(--border);
  padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex-shrink: 0;
}
.tc-sb-lbl { font-size: var(--fs-1); color: var(--text2); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 3px; }
.tc-sb-inp, .tc-sb-sel {
  width: 100%; height: var(--h-4); padding: 0 8px; background: var(--input-bg);
  border: 1px solid var(--input-border); border-radius: 4px; color: var(--text); font-size: var(--fs-3);
}
.tc-sb-inp:focus, .tc-sb-sel:focus { outline: none; border-color: #1976D2; }
.tc-sb-row2 { display: flex; gap: 6px; }
.tc-sb-row2 .tc-sb-sel, .tc-sb-row2 .tc-sb-inp { flex: 1; min-width: 0; }
.tc-time-box { display: none; flex-direction: column; gap: 6px; }
.tc-time-box.show { display: flex; }
/* Action button trong bảng — style/vị trí giống hệt Danh sách phiếu nhập
   (mod_dsphieu.html .dsp-btn-xem/.dsp-btn-xoa), tự khai báo class riêng ở
   đây để module này không phụ thuộc file khác. */
.tc-btn-xem { background: var(--blue); color: #fff; border: none; border-radius: 3px; padding: 3px 8px; font-size: var(--fs-1); cursor: pointer; font-weight: 700; }
.tc-btn-xem:hover { background: var(--blue-dark); }
.tc-btn-xoa { background: var(--red); color: #fff; border: none; border-radius: 3px; padding: 3px 8px; font-size: var(--fs-1); cursor: not-allowed; font-weight: 700; opacity: .45; }

.tc-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.tc-topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
.tc-topbar-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.tc-tbl-wrap { flex: 1; overflow: auto; border: 1px solid var(--border); margin: 8px 10px; border-radius: 6px; background: var(--bg2); }
.tc-tbl { width: 100%; border-collapse: collapse; min-width: 1100px; }
.tc-tbl th { background: #0a2040; color: var(--text2); padding: 8px 10px; text-align: left; font-size: var(--fs-1); font-weight: 700; white-space: nowrap; border-bottom: 1px solid var(--border); border-right: 1px solid #0d1f3c; }
.tc-tbl th:last-child { border-right: none; }
.tc-tbl td { padding: 7px 10px; font-size: var(--fs-2); color: var(--text); border-right: 1px solid #0d1f3c; border-bottom: 1px solid #0d1f3c; vertical-align: middle; }
.tc-tbl td:last-child { border-right: none; }
.tc-tbl tbody tr:hover { background: #0d2347; }

.tc-pager { background: var(--bg2); border-top: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.tc-pg-info { font-size: var(--fs-2); color: var(--text2); }
.tc-pg-btns { display: flex; gap: 4px; }
.tc-pg-btn { width: var(--h-2); height: var(--h-2); border: 1px solid var(--border); background: var(--bg); color: var(--text2); border-radius: 4px; cursor: pointer; font-size: var(--fs-2); display: flex; align-items: center; justify-content: center; }
.tc-pg-btn:hover { background: var(--border); color: #fff; }
.tc-pg-btn.on { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
.tc-pg-btn:disabled { opacity: .3; cursor: not-allowed; }
</style>

<div class="page layout" id="page-thuchi">

<script>
// ════════════════════════════════════════════════════════════════
//  CONTROLLER LAYER: ThuChiModule (mod_thuchi.html)
//  Sprint 14 — Quản lý Thu Chi Công Nợ
// ════════════════════════════════════════════════════════════════
const ThuChiModule = {
  PAGE_SIZE: 20,

  state: { allData: [], filtered: [], currentPage: 1 },
  dom: {},
  initialized: false,

  init() {
    if (this.initialized) return;
    this.cacheDOM();
    this.populateTimeSelectors_();
    this.bindEvents();
    this.applyTimeTypeVisibility_();
    this.initialized = true;
  },

  cacheDOM() {
    this.dom = {
      fLoai: document.getElementById('tc-f-loai'),
      fSearch: document.getElementById('tc-f-search'),
      fTimeType: document.getElementById('tc-f-timetype'),
      boxNgay: document.getElementById('tc-time-ngay'),
      boxTuNgay: document.getElementById('tc-time-tungay'),
      boxThang: document.getElementById('tc-time-thang'),
      boxQuy: document.getElementById('tc-time-quy'),
      boxNam: document.getElementById('tc-time-nam'),
      fNgay: document.getElementById('tc-f-ngay'),
      fTu: document.getElementById('tc-f-tu'),
      fDen: document.getElementById('tc-f-den'),
      fThang: document.getElementById('tc-f-thang'),
      fThangNam: document.getElementById('tc-f-thang-nam'),
      fQuy: document.getElementById('tc-f-quy'),
      fQuyNam: document.getElementById('tc-f-quy-nam'),
      fNam: document.getElementById('tc-f-nam'),
      btnReload: document.getElementById('tc-btn-reload'),
      btnSearch: document.getElementById('tc-btn-search'),
      btnAdd: document.getElementById('tc-btn-add'),
      tblBody: document.getElementById('tc-tbl-body'),
      pgInfo: document.getElementById('tc-pg-info'),
      pgBtns: document.getElementById('tc-pg-btns')
    };
  },

  // Điền option Tháng/Quý/Năm + set mặc định = thời điểm hiện tại (đúng ví dụ
  // evidence "Tháng 8" "2026" — KHÔNG hard-code số, luôn lấy từ Date thật).
  populateTimeSelectors_() {
    const today = new Date();
    const y = today.getFullYear(), m = today.getMonth() + 1, q = Math.floor(today.getMonth() / 3) + 1;

    let monthOpts = '';
    for (let i = 1; i <= 12; i++) monthOpts += `<option value="${i}"${i === m ? ' selected' : ''}>Tháng ${i}</option>`;
    this.dom.fThang.innerHTML = monthOpts;

    let yearOpts = '';
    for (let i = y - 5; i <= y + 1; i++) yearOpts += `<option value="${i}"${i === y ? ' selected' : ''}>${i}</option>`;
    this.dom.fThangNam.innerHTML = yearOpts;
    this.dom.fQuyNam.innerHTML = yearOpts;
    this.dom.fNam.innerHTML = yearOpts;
    this.dom.fQuy.value = String(q);
    this.dom.fNgay.value = today.toISOString().slice(0, 10);
  },

  bindEvents() {
    this.dom.btnReload.onclick = () => this.loadData();
    this.dom.btnSearch.onclick = () => this.applyFilter();
    this.dom.fLoai.onchange = () => this.applyFilter();
    this.dom.fSearch.oninput = () => this.applyFilter();
    this.dom.fTimeType.onchange = () => { this.applyTimeTypeVisibility_(); this.applyFilter(); };
    [this.dom.fNgay, this.dom.fTu, this.dom.fDen, this.dom.fThang, this.dom.fThangNam,
     this.dom.fQuy, this.dom.fQuyNam, this.dom.fNam].forEach(el => { el.onchange = () => this.applyFilter(); });
    this.dom.btnAdd.onclick = () => {
      ThuChiCongNoEditor.open({ onSaved: () => this.loadData() });
    };
  },

  // Chỉ hiện đúng 1 vùng input theo loại thời gian đang chọn (evidence: Ngày
  // → 1 ô ngày; Từ ngày → 2 ô; Tháng/Quý → dropdown + Năm; Năm → 1 dropdown).
  applyTimeTypeVisibility_() {
    const t = this.dom.fTimeType.value;
    this.dom.boxNgay.classList.toggle('show', t === 'ngay');
    this.dom.boxTuNgay.classList.toggle('show', t === 'tungay');
    this.dom.boxThang.classList.toggle('show', t === 'thang');
    this.dom.boxQuy.classList.toggle('show', t === 'quy');
    this.dom.boxNam.classList.toggle('show', t === 'nam');
  },

  openEdit(tccnID) {
    const rec = this.state.allData.find(r => String(r.tccnID) === String(tccnID));
    if (!rec) { toast('Không tìm thấy giao dịch.', 'warn'); return; }
    ThuChiCongNoEditor.open({ mode: 'edit', record: rec, onSaved: () => this.loadData() });
  },

  loadData() {
    this.renderLoading_();
    ApiClient.call('apiThuChiList')
      .then(res => {
        if (!res || !res.success) {
          this.renderError_((res && res.message) || 'Lỗi không xác định');
          return;
        }
        // Mới nhất trước — cùng quy ước hiển thị của các module danh sách khác.
        this.state.allData = (res.data || []).slice().sort((a, b) => String(b.ngay).localeCompare(String(a.ngay)));
        this.applyFilter();
      })
      .catch(err => this.renderError_(err.message));
  },

  applyFilter() {
    const loai = this.dom.fLoai.value;
    const q = (this.dom.fSearch.value || '').toLowerCase().trim();
    const timeRange = this.getTimeRange_(); // {from,to} — 'yyyy-MM-dd' hoặc null = không giới hạn
    this.state.filtered = this.state.allData.filter(r => {
      if (loai && r.thuChi !== loai) return false;
      if (q && !((r.soPhieu || '').toLowerCase().includes(q) || (r.entityName || '').toLowerCase().includes(q))) return false;
      const d = String(r.ngay || '').slice(0, 10);
      if (timeRange.from && (!d || d < timeRange.from)) return false;
      if (timeRange.to && (!d || d > timeRange.to)) return false;
      return true;
    });
    this.state.currentPage = 1;
    this.renderTable_();
  },

  // Chuyển lựa chọn Ngày/Từ ngày/Tháng/Quý/Năm thành khoảng ISO [from,to] để
  // so sánh trực tiếp với `r.ngay` ('yyyy-MM-dd') — so sánh CHUỖI ISO, không
  // qua Date object, tránh lệch múi giờ/định dạng (đúng bài học Sprint 11/14).
  getTimeRange_() {
    const pad = n => String(n).padStart(2, '0');
    const t = this.dom.fTimeType.value;
    if (t === 'ngay') {
      const v = this.dom.fNgay.value;
      return v ? { from: v, to: v } : { from: null, to: null };
    }
    if (t === 'tungay') {
      return { from: this.dom.fTu.value || null, to: this.dom.fDen.value || null };
    }
    if (t === 'thang') {
      const y = Number(this.dom.fThangNam.value), m = Number(this.dom.fThang.value);
      if (!y || !m) return { from: null, to: null };
      const lastDay = new Date(y, m, 0).getDate();
      return { from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-${pad(lastDay)}` };
    }
    if (t === 'quy') {
      const y = Number(this.dom.fQuyNam.value), qq = Number(this.dom.fQuy.value);
      if (!y || !qq) return { from: null, to: null };
      const startM = (qq - 1) * 3 + 1, endM = startM + 2;
      const lastDay = new Date(y, endM, 0).getDate();
      return { from: `${y}-${pad(startM)}-01`, to: `${y}-${pad(endM)}-${pad(lastDay)}` };
    }
    if (t === 'nam') {
      const y = Number(this.dom.fNam.value);
      if (!y) return { from: null, to: null };
      return { from: `${y}-01-01`, to: `${y}-12-31` };
    }
    return { from: null, to: null };
  },

  renderLoading_() {
    this.dom.tblBody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--text2);font-style:italic"><span class="spin"></span> Đang tải danh sách thu chi...</td></tr>`;
  },
  renderError_(msg) {
    this.dom.tblBody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--red);font-weight:bold">Lỗi tải dữ liệu: ${msg}</td></tr>`;
  },

  renderTable_() {
    if (!this.state.filtered.length) {
      this.dom.tblBody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">Không có dữ liệu</td></tr>`;
      this.renderPager_(0);
      return;
    }
    const start = (this.state.currentPage - 1) * this.PAGE_SIZE;
    const pageData = this.state.filtered.slice(start, start + this.PAGE_SIZE);
    this.dom.tblBody.innerHTML = pageData.map((r, idx) => {
      const isThu = r.thuChi === 'Thu';
      return `
        <tr>
          <td onclick="event.stopPropagation()" style="text-align:center;white-space:nowrap">
            <button class="tc-btn-xem" onclick="ThuChiModule.openEdit('${r.tccnID}')">Xem</button>
            <button class="tc-btn-xoa" style="margin-left:4px" disabled title="Chưa triển khai — Evidence Required (chưa đủ căn cứ Xóa hard/soft delete, hoàn công nợ, audit log)">Xóa</button>
          </td>
          <td style="text-align:center;color:var(--text2)">${start + idx + 1}</td>
          <td>${this.fmtDate_(r.ngay)}</td>
          <td style="font-weight:600;color:#90caf9">${r.soPhieu}</td>
          <td style="text-align:center">${isThu ? '<span class="kk-badge draft" style="background:#1B3A1F;color:#69F0AE">Thu</span>' : '<span class="kk-badge draft" style="background:#3E2000;color:#FFB74D">Chi</span>'}</td>
          <td>${r.entityName || '—'}</td>
          <td>${r.diaChi || '—'}</td>
          <td>${r.ghiChu || '—'}</td>
          <td style="text-align:right;color:#66bb6a">${isThu ? this.fmt_(r.soTien) : ''}</td>
          <td style="text-align:right;color:#ef5350">${!isThu ? this.fmt_(r.soTien) : ''}</td>
          <td>${r.httt || '—'}</td>
        </tr>`;
    }).join('');
    this.renderPager_(this.state.filtered.length);
  },

  renderPager_(total) {
    const pages = Math.ceil(total / this.PAGE_SIZE);
    if (!total) {
      this.dom.pgInfo.textContent = 'Tổng số bản ghi: 0 - Tổng số trang: 0';
      this.dom.pgBtns.innerHTML = '';
      return;
    }
    this.dom.pgInfo.textContent = `Tổng số bản ghi: ${total} - Tổng số trang: ${pages}`;
    let html = `<button class="tc-pg-btn" onclick="ThuChiModule.gotoPage(${this.state.currentPage - 1})" ${this.state.currentPage === 1 ? 'disabled' : ''}>‹</button>`;
    const from = Math.max(1, this.state.currentPage - 2);
    const to = Math.min(pages, from + 4);
    for (let i = from; i <= to; i++) {
      html += `<button class="tc-pg-btn${i === this.state.currentPage ? ' on' : ''}" onclick="ThuChiModule.gotoPage(${i})">${i}</button>`;
    }
    html += `<button class="tc-pg-btn" onclick="ThuChiModule.gotoPage(${this.state.currentPage + 1})" ${this.state.currentPage === pages ? 'disabled' : ''}>›</button>`;
    this.dom.pgBtns.innerHTML = html;
  },

  gotoPage(p) {
    const maxPage = Math.ceil(this.state.filtered.length / this.PAGE_SIZE);
    if (p < 1 || p > maxPage) return;
    this.state.currentPage = p;
    this.renderTable_();
  },

  fmtDate_(iso) {
    const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[3]}-${m[2]}-${m[1]}` : (iso || '—');
  },

  fmt_(v) {
    const n = Math.round(Number(v) || 0);
    return n === 0 ? '0' : n.toLocaleString('vi-VN');
  }
};
</script>
