<script>
// ════════════════════════════════════════════════════════════════
//  CONTROLLER LAYER: TonKhoModule (mod_tonkho.html)
//  Sprint 10A: Báo cáo Tồn kho — Quantity + Lot Inventory
// ════════════════════════════════════════════════════════════════
const TonKhoModule = {
  PAGE_SIZE: 15,

  // Số cột hiện tại của Grid, đổi theo mode (product-level = 11,
  // lot-level = 12, thêm cột "Số lô/Hạn dùng" — đúng reference).
  COLS_PRODUCT: 11,
  COLS_LOT: 12,

  state: {
    allData: [],      // Raw TK_KHO rows đã enrich theo Product (cấp LÔ)
    catalog: [],       // Product catalog đầy đủ (để build filter option + enrich)
    nhomList: [],       // Master Data Nhóm sản phẩm (apiNhomSPLoad)
    nccList: [],        // Master Data Nhà cung cấp (apiNccLoad)
    filtered: [],      // allData sau filter (vẫn cấp LÔ)
    grouped: [],       // filtered sau khi group theo MaSP (dùng cho cả 2 mode + pagination)
    currentPage: 1,
    sidebarHidden: false
  },

  dom: {},
  initialized: false,

  init() {
    if (this.initialized) return;
    this.cacheDOM();
    this.bindEvents();
    this.renderHead();
    this.initialized = true;
  },

  cacheDOM() {
    this.dom = {
      sidebar: document.getElementById('tk-sidebar'),
      fNhom: document.getElementById('tk-f-nhom'),
      fVitri: document.getElementById('tk-f-vitri'),
      fNcc: document.getElementById('tk-f-ncc'),
      fSearch: document.getElementById('tk-f-search'),
      fSp: document.getElementById('tk-f-sp'),
      fKho: document.getElementById('tk-f-kho'),
      fTrangthai: document.getElementById('tk-f-trangthai'),
      fXemthelo: document.getElementById('tk-f-xemthelo'),

      btnSearch: document.getElementById('tk-btn-search'),
      btnExport: document.getElementById('tk-btn-export'),
      btnPrint: document.getElementById('tk-btn-print'),
      btnToggleFilter: document.getElementById('tk-btn-toggle-filter'),

      tblHead: document.getElementById('tk-tbl-head'),
      tblBody: document.getElementById('tk-tbl-body'),
      pgInfo: document.getElementById('tk-pg-info'),
      pgBtns: document.getElementById('tk-pg-btns')
    };
  },

  bindEvents() {
    this.dom.btnSearch.onclick = () => this.applyFilter();
    this.dom.btnExport.onclick = () => this.exportExcel();
    this.dom.btnPrint.onclick = () => toast('Tính năng in báo cáo đang phát triển', 'warn');
    this.dom.btnToggleFilter.onclick = () => this.toggleSidebar();

    this.dom.fNhom.onchange = () => this.applyFilter();
    this.dom.fVitri.onchange = () => this.applyFilter();
    this.dom.fNcc.onchange = () => this.applyFilter();
    this.dom.fKho.onchange = () => this.applyFilter();
    this.dom.fTrangthai.onchange = () => this.applyFilter();
    this.dom.fXemthelo.onchange = () => this.applyFilter();

    // Global shortcut F3 -> product search input (chỉ khi trang Tồn kho
    // đang hiển thị — đúng BR-DR/STK-DEC-007 pattern đã dùng ở module khác).
    document.addEventListener('keydown', e => {
      if (e.key === 'F3') {
        const page = document.getElementById('page-tonkho');
        if (page && page.classList.contains('show')) {
          e.preventDefault();
          this.dom.fSp.focus();
        }
      }
    });
  },

  toggleSidebar() {
    this.state.sidebarHidden = !this.state.sidebarHidden;
    this.dom.sidebar.classList.toggle('tk-hidden', this.state.sidebarHidden);
  },

  loadData() {
    this.renderLoading();
    Promise.all([
      InventoryService.load(),
      typeof ProductService !== 'undefined' ? ProductService.load() : Promise.resolve([]),
      ApiClient.call('apiNhomSPLoad').catch(() => ({ success: false, data: [] })),
      ApiClient.call('apiNccLoad').catch(() => ({ success: false, data: [] }))
    ])
      .then(([stockList, catalog, nhomRes, nccRes]) => {
        this.state.catalog = catalog || [];
        this.state.nhomList = (nhomRes && nhomRes.success) ? (nhomRes.data || []) : [];
        this.state.nccList = (nccRes && nccRes.success) ? (nccRes.data || []) : [];

        // Enrich mỗi dòng TK_KHO (cấp LÔ) với thông tin Product đúng field
        // thật (dvtGoc/giaBanLe/nhomSP/viTri/ncc) — KHÔNG dùng baseUnit
        // (field không tồn tại — nguyên nhân BUG-TỒN-001) và KHÔNG dùng
        // uoms[0] (thứ tự không đảm bảo là ĐVT gốc).
        this.state.allData = (stockList || []).map(s => {
          const maSP = s.MaSP || s.maSP || '';
          const prod = this.state.catalog.find(p => p.maSP === maSP);
          return {
            maSP: maSP,
            tenSP: s.TenSP || s.tenSP || (prod ? prod.tenSP : ''),
            kho: s.Kho || s.kho || 'Kho chính',
            soLo: s.SoLo || s.soLo || '',
            hanDung: s.HanDung || s.hanDung || '',
            slTon: parseFloat(s.SLTon || s.slTon || 0),
            dvt: prod ? (prod.dvtGoc || '') : '',
            // Sprint 15.7 Phase 2.3 (PO tường minh, COST-DEC-03 → STK-DEC-009):
            // giá vốn HIỆN HÀNH của ĐÚNG lot này (Option D Hybrid, LOCKED) —
            // KHÔNG phải DMSP.GiaNhapMacDinh, KHÔNG phải costing tự chọn.
            giaNhap: parseFloat(s.GiaVon || s.giaVon || 0),
            giaBan: prod ? (Number(prod.giaBanLe) || 0) : 0,
            nhomSP: prod ? (prod.nhomSP || '') : '',
            viTri: prod ? (prod.viTri || '') : '',
            ncc: prod ? (prod.ncc || '') : ''
          };
        });

        this.buildFilterOptions_();
        this.applyFilter();
      })
      .catch(err => {
        this.renderError(err.message);
      });
  },

  // Dựng option cho 4 dropdown động — Nhóm sản phẩm/NCC lấy từ Master Data
  // đã có sẵn (Sprint 1/Sprint 8.0), Vị trí sản phẩm lấy DISTINCT từ
  // Product.viTri hiện có (PO Decision mục 4 — không tạo Master Data mới),
  // Kho lấy DISTINCT từ chính dữ liệu TK_KHO đã tải (PO Decision mục 4 —
  // không hard-code, không đổi backend/architecture).
  buildFilterOptions_() {
    // Nhóm sản phẩm
    const nhomHtml = ['<option value="">Tất cả</option>']
      .concat(this.state.nhomList.map(n => `<option value="${this.escAttr_(n.tenNhom)}">${this.escHtml_(n.tenNhom)}</option>`));
    this.dom.fNhom.innerHTML = nhomHtml.join('');

    // Nhà cung cấp — value = maNCC (khớp Product.ncc = MaNCCMacDinh)
    const nccHtml = ['<option value="">Chọn nhà cung cấp</option>']
      .concat(this.state.nccList.map(n => `<option value="${this.escAttr_(n.maNCC)}">${this.escHtml_(n.tenNCC)}</option>`));
    this.dom.fNcc.innerHTML = nccHtml.join('');

    // Vị trí sản phẩm — distinct từ toàn bộ catalog (không chỉ SP có tồn)
    const viTriSet = new Set();
    this.state.catalog.forEach(p => { if (p.viTri) viTriSet.add(p.viTri); });
    const viTriHtml = ['<option value="">Tất cả</option>']
      .concat(Array.from(viTriSet).sort().map(v => `<option value="${this.escAttr_(v)}">${this.escHtml_(v)}</option>`));
    this.dom.fVitri.innerHTML = viTriHtml.join('');

    // Kho — distinct từ TK_KHO đã tải, fallback "Kho chính" nếu rỗng
    const khoSet = new Set();
    this.state.allData.forEach(d => { if (d.kho) khoSet.add(d.kho); });
    if (!khoSet.size) khoSet.add('Kho chính');
    const khoHtml = ['<option value="">Tất cả kho</option>']
      .concat(Array.from(khoSet).sort().map(k => `<option value="${this.escAttr_(k)}">${this.escHtml_(k)}</option>`));
    this.dom.fKho.innerHTML = khoHtml.join('');
  },

  escHtml_(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  },
  escAttr_(s) {
    return this.escHtml_(s).replace(/'/g, '&#39;');
  },

  applyFilter() {
    const search = (this.dom.fSearch.value || '').toLowerCase().trim();
    const sp = (this.dom.fSp.value || '').toLowerCase().trim();
    const kho = this.dom.fKho.value;
    const trangthai = this.dom.fTrangthai.value;
    const nhom = this.dom.fNhom.value;
    const vitri = this.dom.fVitri.value;
    const ncc = this.dom.fNcc.value;

    this.state.filtered = this.state.allData.filter(item => {
      if (search && !(
        item.maSP.toLowerCase().includes(search) ||
        item.tenSP.toLowerCase().includes(search)
      )) return false;

      if (sp && !(
        item.maSP.toLowerCase().includes(sp) ||
        item.tenSP.toLowerCase().includes(sp)
      )) return false;

      if (kho && item.kho !== kho) return false;
      if (nhom && item.nhomSP !== nhom) return false;
      if (vitri && item.viTri !== vitri) return false;
      if (ncc && item.ncc !== ncc) return false;

      return true;
    });

    // Group theo MaSP TRƯỚC (Product-level tổng hợp), sau đó mới áp filter
    // "Trạng thái còn/hết hàng" TRÊN TỔNG của sản phẩm — nếu áp filter
    // trạng thái ở cấp lô trước, 1 sản phẩm còn hàng nhưng đang lọc theo
    // lô hết hàng sẽ bị mất nhầm dòng, sai với BR-STK-01 (1 Product = 1 dòng).
    let grouped = this.groupByProduct_(this.state.filtered);
    if (trangthai === 'con') grouped = grouped.filter(g => g.slTon > 0);
    if (trangthai === 'het') grouped = grouped.filter(g => g.slTon <= 0);

    this.state.grouped = grouped;
    this.state.currentPage = 1;
    this.renderHead();
    this.renderTable();
    this.renderSummary();
  },

  // BR-STK-01/02: gộp toàn bộ dòng LÔ (cùng MaSP) thành 1 group. Group luôn
  // được build sẵn — chế độ hiển thị (render) mới là nơi quyết định show
  // dòng lô con hay không, KHÔNG tính lại tồn 2 lần cho 2 mode (đúng yêu
  // cầu "1 nguồn dữ liệu tồn duy nhất, không tạo 2 inventory calculation
  // engines" — BusinessLogic mục 6).
  groupByProduct_(items) {
    const map = new Map();
    items.forEach(it => {
      if (!map.has(it.maSP)) {
        map.set(it.maSP, {
          maSP: it.maSP,
          tenSP: it.tenSP,
          dvt: it.dvt,
          giaBan: it.giaBan,
          nhomSP: it.nhomSP,
          viTri: it.viTri,
          slTon: 0,
          thanhTienBan: 0,
          thanhTienNhap: 0,
          lots: []
        });
      }
      const g = map.get(it.maSP);
      g.slTon += it.slTon;
      g.thanhTienBan += it.slTon * it.giaBan;
      // COST-DEC-03 (LOCKED): Giá trị tồn = Σ(SLTon LOT × GiaVon LOT).
      // Giá vốn tồn bình quân của Product được derive ở renderTable()
      // (thanhTienNhap / slTon), không lưu riêng để tránh 2 nguồn lệch nhau.
      g.thanhTienNhap += it.slTon * it.giaNhap;
      g.lots.push(it);
    });
    return Array.from(map.values());
  },

  colspan_() {
    return this.dom.fXemthelo.checked ? this.COLS_LOT : this.COLS_PRODUCT;
  },

  renderHead() {
    const lotMode = this.dom.fXemthelo.checked;
    const cols = [
      '<th style="width:44px;text-align:center">STT</th>',
      '<th style="width:100px">Mã SP</th>',
      '<th>Tên sản phẩm</th>',
      '<th style="width:80px">ĐVT</th>'
    ];
    if (lotMode) {
      cols.push('<th style="width:140px">Số lô/Hạn dùng</th>');
    }
    cols.push(
      '<th style="width:90px;text-align:right">Tồn kho</th>',
      '<th style="width:110px;text-align:right">Giá nhập</th>',
      '<th style="width:110px;text-align:right">Giá bán</th>',
      '<th style="width:130px;text-align:right">Thành tiền nhập</th>',
      '<th style="width:130px;text-align:right">Thành tiền bán</th>',
      '<th style="width:120px">Nhóm sản phẩm</th>',
      '<th style="width:120px">Vị trí sản phẩm</th>'
    );
    this.dom.tblHead.innerHTML = `<tr>${cols.join('')}</tr>`;
  },

  renderLoading() {
    this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">
      <span class="spin"></span> Đang tải dữ liệu tồn kho...
    </td></tr>`;
  },

  renderError(msg) {
    this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--red);font-weight:bold">
      Lỗi tải dữ liệu: ${msg}
    </td></tr>`;
    this.dom.sumTon = null;
  },

  moneyOrDash_(v) {
    if (v === null || v === undefined) return '<span class="tk-dash">—</span>';
    return this.fmt(v);
  },

  // Sprint 15.7 Phase 2.3: Giá nhập/Giá vốn tồn có thể ra số thập phân
  // (VD 3.333,33) — KHÔNG làm tròn về số nguyên như fmt() (dùng cho SL/Giá
  // bán). Tối đa 2 chữ số thập phân, không ép thêm ",00" nếu là số nguyên
  // (đúng evidence: 875 → "875", 3.333,33 → "3.333,33").
  fmtDecimal_(v) {
    const n = parseFloat(v) || 0;
    if (n === 0) return '0';
    return n.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
  },

  renderTable() {
    const lotMode = this.dom.fXemthelo.checked;

    if (!this.state.grouped.length) {
      this.dom.tblBody.innerHTML = `<tr><td colspan="${this.colspan_()}" style="text-align:center;padding:32px;color:var(--text2);font-style:italic">Không tìm thấy dữ liệu tồn kho</td></tr>`;
      this.renderPager(0);
      return;
    }

    const start = (this.state.currentPage - 1) * this.PAGE_SIZE;
    const pageGroups = this.state.grouped.slice(start, start + this.PAGE_SIZE);

    const rows = [];
    pageGroups.forEach((g, idx) => {
      const stt = start + idx + 1;
      const tonColor = g.slTon <= 0 ? 'color:var(--red)' : g.slTon < 10 ? 'color:#ffcc02' : 'color:var(--text)';
      // COST-DEC-03 (LOCKED): Giá vốn tồn bình quân = Tổng giá trị tồn / Tổng
      // SL tồn — bình quân gia quyền theo lượng tồn hiện tại, KHÔNG phải
      // trung bình cộng giá các lô.
      const gGiaNhap = g.slTon > 0 ? g.thanhTienNhap / g.slTon : 0;

      if (!lotMode) {
        // BR-STK-01: Xem theo lô OFF => 1 Product = 1 dòng.
        rows.push(`
          <tr class="tk-row">
            <td style="text-align:center;color:var(--text2)">${stt}</td>
            <td style="color:#90caf9;font-weight:600">${g.maSP}</td>
            <td style="font-weight:500">${g.tenSP || '—'}</td>
            <td>${g.dvt || '—'}</td>
            <td style="text-align:right;font-weight:700;${tonColor}">${this.fmt(g.slTon)}</td>
            <td style="text-align:right">${this.fmtDecimal_(gGiaNhap)}</td>
            <td style="text-align:right;color:#66bb6a">${g.giaBan ? this.fmt(g.giaBan) : '0'}</td>
            <td style="text-align:right">${this.fmtDecimal_(g.thanhTienNhap)}</td>
            <td style="text-align:right;font-weight:700;color:#66bb6a">${this.fmt(g.thanhTienBan)}</td>
            <td>${g.nhomSP || '—'}</td>
            <td>${g.viTri || '—'}</td>
          </tr>`);
        return;
      }

      // BR-STK-02/BR-STK-04: Xem theo lô ON => dòng sản phẩm (tổng, bold)
      // + từng dòng lô con thụt vào bên dưới, không gộp lô khác hạn dùng.
      rows.push(`
        <tr class="tk-row tk-row-product">
          <td style="text-align:center;color:var(--text2)">${stt}</td>
          <td style="color:#90caf9">${g.maSP}</td>
          <td>${g.tenSP || '—'}</td>
          <td></td>
          <td></td>
          <td style="text-align:right;${tonColor}">${this.fmt(g.slTon)}</td>
          <td style="text-align:right">${this.fmtDecimal_(gGiaNhap)}</td>
          <td style="text-align:right;color:#66bb6a">${g.giaBan ? this.fmt(g.giaBan) : '0'}</td>
          <td style="text-align:right">${this.fmtDecimal_(g.thanhTienNhap)}</td>
          <td style="text-align:right;color:#66bb6a">${this.fmt(g.thanhTienBan)}</td>
          <td>${g.nhomSP || '—'}</td>
          <td>${g.viTri || '—'}</td>
        </tr>`);

      g.lots.forEach(lot => {
        const lotLabel = (lot.soLo || lot.hanDung)
          ? `${lot.soLo || '-'}${lot.hanDung ? ' - ' + lot.hanDung : ''}`
          : '—';
        const lotThanhTienBan = lot.slTon * lot.giaBan;
        // Theo LOT: đọc thẳng giá vốn của ĐÚNG lot đó — không ambiguous,
        // không cần bình quân (mỗi lô 1 giá vốn riêng, Option D Hybrid).
        const lotThanhTienNhap = lot.slTon * lot.giaNhap;
        rows.push(`
          <tr class="tk-row tk-row-lot">
            <td></td>
            <td></td>
            <td class="tk-lot-indent">${lot.tenSP || ''}</td>
            <td>${lot.dvt || '—'}</td>
            <td>${lotLabel}</td>
            <td style="text-align:right">${this.fmt(lot.slTon)}</td>
            <td style="text-align:right">${this.fmtDecimal_(lot.giaNhap)}</td>
            <td style="text-align:right">${lot.giaBan ? this.fmt(lot.giaBan) : '0'}</td>
            <td style="text-align:right">${this.fmtDecimal_(lotThanhTienNhap)}</td>
            <td style="text-align:right">${this.fmt(lotThanhTienBan)}</td>
            <td></td>
            <td></td>
          </tr>`);
      });
    });

    this.dom.tblBody.innerHTML = rows.join('');
    this.renderPager(this.state.grouped.length);
  },

  // Dòng TỔNG CỘNG được vẽ như 1 hàng riêng trong renderTable() thay vì cố
  // định trong HTML — vì số cột đổi theo mode. Ghép luôn vào đầu tbody.
  renderSummary() {
    const totalTon = this.state.grouped.reduce((acc, g) => acc + g.slTon, 0);
    const totalMoneyBan = this.state.grouped.reduce((acc, g) => acc + g.thanhTienBan, 0);
    const lotMode = this.dom.fXemthelo.checked;
    const dashCols = lotMode ? 2 : 1; // ĐVT (+ Số lô/Hạn dùng nếu lot mode)

    const sumRow = `
      <tr class="tk-sum-tr">
        <td></td>
        <td></td>
        <td style="font-weight:700">TỔNG CỘNG</td>
        ${'<td></td>'.repeat(dashCols)}
        <td style="text-align:right" class="tk-sum-val-ton">${this.fmt(totalTon)}</td>
        <td style="text-align:right" class="tk-dash">—</td>
        <td></td>
        <td style="text-align:right" class="tk-dash">—</td>
        <td style="text-align:right" class="tk-sum-val-money">${this.fmt(totalMoneyBan)}</td>
        <td></td>
        <td></td>
      </tr>`;
    this.dom.tblBody.insertAdjacentHTML('afterbegin', sumRow);
  },

  renderPager(total) {
    const pages = Math.ceil(total / this.PAGE_SIZE);
    const info = this.dom.pgInfo;
    const btns = this.dom.pgBtns;
    if (!total) {
      info.textContent = 'Tổng số bản ghi: 0 - Tổng số trang: 0';
      btns.innerHTML = '';
      return;
    }
    const start = (this.state.currentPage - 1) * this.PAGE_SIZE + 1;
    const end = Math.min(this.state.currentPage * this.PAGE_SIZE, total);
    info.textContent = `Tổng số bản ghi: ${total} - Tổng số trang: ${pages} (Hiển thị ${start}–${end})`;

    let html = `<button class="tk-pg-btn" onclick="TonKhoModule.gotoPage(1)" ${this.state.currentPage === 1 ? 'disabled' : ''}>«</button>`;
    html += `<button class="tk-pg-btn" onclick="TonKhoModule.gotoPage(${this.state.currentPage - 1})" ${this.state.currentPage === 1 ? 'disabled' : ''}>‹</button>`;
    const from = Math.max(1, this.state.currentPage - 2);
    const to = Math.min(pages, from + 4);
    for (let i = from; i <= to; i++) {
      html += `<button class="tk-pg-btn${i === this.state.currentPage ? ' on' : ''}" onclick="TonKhoModule.gotoPage(${i})">${i}</button>`;
    }
    html += `<button class="tk-pg-btn" onclick="TonKhoModule.gotoPage(${this.state.currentPage + 1})" ${this.state.currentPage === pages ? 'disabled' : ''}>›</button>`;
    html += `<button class="tk-pg-btn" onclick="TonKhoModule.gotoPage(${pages})" ${this.state.currentPage === pages ? 'disabled' : ''}>»</button>`;
    html += `<input type="number" class="tk-pg-input" value="${this.state.currentPage}" min="1" max="${pages}" onchange="TonKhoModule.gotoPage(parseInt(this.value)||1)" title="Nhảy đến trang">`;
    btns.innerHTML = html;
  },

  // Pagination hoạt động theo cấp SẢN PHẨM (group), không theo dòng lô —
  // đúng STK-CHK-49 "Xem theo lô + pagination — Không mất grouping": 1
  // sản phẩm cùng toàn bộ lô của nó luôn nằm trọn trong 1 trang.
  gotoPage(p) {
    const maxPage = Math.ceil(this.state.grouped.length / this.PAGE_SIZE);
    if (p < 1 || p > maxPage) return;
    this.state.currentPage = p;
    this.renderTable();
    this.renderSummary();
    const wrap = document.querySelector('.tk-tbl-wrap');
    if (wrap) wrap.scrollTop = 0;
  },

  fmt(v) {
    const n = parseFloat(v) || 0;
    if (n === 0) return '0';
    return Math.round(n).toLocaleString('vi-VN');
  },

  // ── Xuất Excel ──────────────────────────────────────────────────
  // Không có thư viện tạo file .xlsx nhị phân trong dự án (đã audit toàn
  // repo, không tìm thấy) — REUSE đúng pattern CSV+BOM đã dùng ở
  // mod_dsphieuxuat.html exportCsv() (Sprint 6.0) thay vì tạo exporter
  // mới/thêm dependency mới (đúng yêu cầu "không refactor architecture
  // ngoài phạm vi"). File .csv mở trực tiếp được bằng Excel.
  //
  // Export từ this.state.grouped — đây CHÍNH LÀ dữ liệu đã áp dụng đầy đủ
  // filter/search hiện tại (Kho/Trạng thái/Nhóm sản phẩm/Vị trí sản
  // phẩm/NCC/Tìm kiếm/Tên sản phẩm-mã vạch, xem applyFilter()) và đã group
  // theo sản phẩm — KHÔNG phải state.grouped sau khi .slice() phân trang
  // (đó chỉ xảy ra cục bộ trong renderTable()), nên export luôn là TOÀN BỘ
  // dataset đã lọc, không phải page hiện tại/viewport.
  //
  // Cấu trúc export bám đúng renderTable(): mode "Xem theo lô" OFF = 1
  // dòng/sản phẩm; ON = dòng sản phẩm (tổng) + dòng lô con ngay dưới, giữ
  // nguyên Số lô/Hạn dùng — không mất thông tin lot.
  //
  // Sprint 15.7 Phase 2.3: Giá nhập/Thành tiền nhập xuất đúng số thật,
  // khớp Grid (COST-DEC-03, LOCKED) — không còn "—".
  exportExcel() {
    if (!this.state.grouped.length) { toast('Không có dữ liệu để xuất!', 'warn'); return; }

    const lotMode = this.dom.fXemthelo.checked;
    const esc = v => {
      v = (v === null || v === undefined) ? '' : String(v);
      if (v.includes(',') || v.includes('"') || v.includes('\n')) {
        v = '"' + v.replace(/"/g, '""') + '"';
      }
      return v;
    };

    const headerCols = ['STT', 'Mã SP', 'Tên sản phẩm', 'ĐVT'];
    if (lotMode) headerCols.push('Số lô/Hạn dùng');
    headerCols.push('Tồn kho', 'Giá nhập', 'Giá bán', 'Thành tiền nhập', 'Thành tiền bán', 'Nhóm sản phẩm', 'Vị trí sản phẩm');

    const rows = [headerCols.map(esc).join(',')];

    this.state.grouped.forEach((g, idx) => {
      const stt = idx + 1;

      const gGiaNhap = g.slTon > 0 ? g.thanhTienNhap / g.slTon : 0;

      if (!lotMode) {
        const cells = [stt, g.maSP, g.tenSP, g.dvt, this.fmt(g.slTon), this.fmtDecimal_(gGiaNhap), g.giaBan ? this.fmt(g.giaBan) : '0', this.fmtDecimal_(g.thanhTienNhap), this.fmt(g.thanhTienBan), g.nhomSP, g.viTri];
        rows.push(cells.map(esc).join(','));
        return;
      }

      // Dòng sản phẩm (tổng) — khớp đúng dòng "tk-row-product" trên Grid.
      const prodCells = [stt, g.maSP, g.tenSP, '', '', this.fmt(g.slTon), this.fmtDecimal_(gGiaNhap), g.giaBan ? this.fmt(g.giaBan) : '0', this.fmtDecimal_(g.thanhTienNhap), this.fmt(g.thanhTienBan), g.nhomSP, g.viTri];
      rows.push(prodCells.map(esc).join(','));

      // Dòng lô con — khớp đúng dòng "tk-row-lot" trên Grid, giữ Số lô/Hạn dùng.
      g.lots.forEach(lot => {
        const lotLabel = (lot.soLo || lot.hanDung)
          ? `${lot.soLo || '-'}${lot.hanDung ? ' - ' + lot.hanDung : ''}`
          : '';
        const lotThanhTienBan = lot.slTon * lot.giaBan;
        const lotThanhTienNhap = lot.slTon * lot.giaNhap;
        const lotCells = ['', '', lot.tenSP, lot.dvt, lotLabel, this.fmt(lot.slTon), this.fmtDecimal_(lot.giaNhap), lot.giaBan ? this.fmt(lot.giaBan) : '0', this.fmtDecimal_(lotThanhTienNhap), this.fmt(lotThanhTienBan), '', ''];
        rows.push(lotCells.map(esc).join(','));
      });
    });

    const BOM = '﻿'; // giúp Excel nhận đúng UTF-8 khi mở file CSV
    const csv = BOM + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = `BaoCaoTonKho_${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
};
</script>
